apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-path
resources:
  - ../../base/local-path/
patches:
  - patch: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
