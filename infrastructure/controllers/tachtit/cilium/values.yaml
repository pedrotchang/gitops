# Single-node cluster needs replicas=1 to avoid port conflicts
operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# Force MTU to 1450 to prevent siderolink's 1280 MTU from being used
MTU: 1450

ipam:
  mode: kubernetes

kubeProxyReplacement: true

cni:
  exclusive: false

socketLB:
  hostNamespaceOnly: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
    serviceMonitor:
      enabled: true
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
    service:
      annotations:
        omni-kube-service-exposer.sidero.dev/port: "50080"
        omni-kube-service-exposer.sidero.dev/label: Hubble

l2announcements:
  enabled: true

# Calculated based on 30 services
# https://docs.cilium.io/en/latest/network/l2-announcements/#sizing-client-rate-limit

k8sClientRateLimit:
  qps: 15
  burst: 20

gatewayAPI:
  enabled: true

ingressController:
  enabled: true
  loadbalancerMode: dedicated
  default: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
