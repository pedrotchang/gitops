apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  releaseName: cilium
  interval: 15m
  chart:
    spec:
      chart: cilium
      version: 1.19.5
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system

  install:
    disableWait: true
  upgrade:
    disableWait: true

  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
