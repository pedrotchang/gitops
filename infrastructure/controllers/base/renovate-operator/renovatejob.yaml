apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo-repos
  namespace: renovate-operator
spec:
  image: renovate/renovate:43.249.5
  schedule: "0 8 * * *"
  parallelism: 1
  provider:
    name: forgejo
    endpoint: http://forgejo.forgejo.svc.cluster.local:3000/api/v1
  discoveryFilters:
    - "platform-infrastructure/gitops-platform"
    - "platform-infrastructure/custom-images"
  extraEnvFrom:
    - secretRef:
        name: renovate-env
  extraEnv:
    - name: RENOVATE_GIT_AUTHOR
      value: "Pedro's Renovate Bot <bot@renovateapp.com>"
