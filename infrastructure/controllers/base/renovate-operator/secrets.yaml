apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-env
  namespace: renovate-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      data:
        RENOVATE_TOKEN: "{{ .RENOVATE_TOKEN }}"
        GITHUB_COM_TOKEN: "{{ .GITHUB_COM_TOKEN }}"
        # Global host rule so Renovate can read the private Forgejo container
        # registry and digest-track first-party custom images (e.g. nextcloud).
        # Credentialed host rules are only honored in Renovate's global config,
        # not in a repo renovate.json — hence injecting it here as an env var.
        RENOVATE_HOST_RULES: '[{"matchHost":"forgejo.seyzahl.com","hostType":"docker","username":"{{ .REGISTRY_USER }}","password":"{{ .REGISTRY_TOKEN }}"}]'
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: forgejo-renovate-token
    - secretKey: GITHUB_COM_TOKEN
      remoteRef:
        key: renovate-token
    - secretKey: REGISTRY_USER
      remoteRef:
        key: forgejo-registry-username
    - secretKey: REGISTRY_TOKEN
      remoteRef:
        key: forgejo-registry-token
