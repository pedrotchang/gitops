apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-events
  namespace: flux-system
spec:
  releaseName: argo-events
  targetNamespace: argo-events
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: argo-events
      version: 2.4.23
      sourceRef:
        kind: HelmRepository
        name: argo-events
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      install: true
      keep: true
    global:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9731
        runAsGroup: 9731
        fsGroup: 9731
        seccompProfile:
          type: RuntimeDefault
    controller:
      replicas: 1
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
      rbac:
        enabled: true
        namespaced: true
        managedNamespace: video-creator
