# Rebalances pods after node outages: the scheduler only places new pods, so
# everything that failed over to one node stays there. Evicted pods are
# rescheduled normally. Pods with PVCs ARE evictable: every app volume is
# network storage (truenas-iscsi / NFS) since the 2026-10-04 migration, so a
# move is a detach/attach, not data loss. System-critical pods stay protected.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
spec:
  suspend: false
  interval: 1h
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: descheduler
      version: "0.37.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: descheduler
  values:
    kind: Deployment
    replicas: 1
    deschedulingInterval: 1m
    deschedulerPolicy:
      # Move at most five pods per run, with at most one per namespace.
      # PDBs, node fit and normal termination grace periods still apply.
      maxNoOfPodsToEvictPerNode: 5
      maxNoOfPodsToEvictPerNamespace: 1
      maxNoOfPodsToEvictTotal: 5
      # Balance only the two general-purpose nodes; the GPU node is overflow,
      # so it must not count as the "empty" node that pods get sent to.
      nodeSelector: "!nvidia.com/gpu.present"
      profiles:
        # Count pods separately from CPU requests: an application can have
        # no CPU request and still occupy a slot after failing over.
        - name: pod-count
          pluginConfig:
            - name: DefaultEvictor
              args:
                nodeFit: true
                nodeSelector: "!nvidia.com/gpu.present"
                minPodAge: 2m
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
            - name: LowNodeUtilization
              args:
                useDeviationThresholds: true
                thresholds:
                  pods: 5
                targetThresholds:
                  pods: 5
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                nodeFit: true
                nodeSelector: "!nvidia.com/gpu.present"
                minPodAge: 2m
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
            - name: RemoveDuplicates
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingTopologySpreadConstraint
            # Deviation mode: nodes are compared to the cluster mean instead of
            # fixed percentages. Fixed thresholds required a node under 20% on
            # every resource, which the ThinkPad never is, so nothing moved.
            # Over = above mean+10 points, under = below mean-10 (CPU requests).
            # Keep CPU balancing independent of the pod-count profile so
            # neither resource masks an imbalance in the other.
            - name: LowNodeUtilization
              args:
                useDeviationThresholds: true
                thresholds:
                  cpu: 10
                targetThresholds:
                  cpu: 10
          plugins:
            # LowNodeUtilization first so the CPU rebalance isn't starved by
            # the duplicate cleanup consuming the per-node eviction budget.
            balance:
              enabled:
                - LowNodeUtilization
                - RemovePodsViolatingTopologySpreadConstraint
                - RemoveDuplicates
            deschedule:
              enabled:
                - RemovePodsViolatingInterPodAntiAffinity
