apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-aws-creds
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: velero-aws-creds
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .id }}
          aws_secret_access_key={{ .key }}
  data:
    - secretKey: id
      remoteRef:
        key: aws-backup-access-key-id
    - secretKey: key
      remoteRef:
        key: aws-backup-secret-access-key
