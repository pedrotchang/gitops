apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia
spec:
  interval: 1h
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.20.1"
      sourceRef:
        kind: HelmRepository
        name: nvdp
        namespace: nvidia
  values:
    # Upstream image pinned by digest; mirror via supply-chain later (#177).
    image:
      repository: nvcr.io/nvidia/k8s-device-plugin
      tag: v0.20.1@sha256:27c1b2553a690ca3d29889dcd61df97525d46f58272c0be8dc63c2b18f120075
    runtimeClassName: nvidia
    # Time-slice the single RTX 5060 into 4 schedulable shares so whisper,
    # Immich ML (and later Ollama) can all request nvidia.com/gpu: 1. They take
    # turns on the card and share its 8 GB VRAM (no memory isolation) — fine for
    # bursty household workloads. GeForce has no MIG.
    config:
      map:
        default: |-
          version: v1
          sharing:
            timeSlicing:
              resources:
                - name: nvidia.com/gpu
                  replicas: 4
      default: default
    # Chart's default affinity schedules on nodes labelled
    # nvidia.com/gpu.present=true (set via the Omni cluster template).
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
