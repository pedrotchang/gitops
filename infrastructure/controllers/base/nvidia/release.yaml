# NVIDIA gpu-operator in Talos mode (Talos 1.13+ docs): the driver and the
# container toolkit come from the Talos system extensions, so the operator
# only runs the CDI-aware device plugin, GPU feature discovery and DCGM. It
# also creates the `nvidia` RuntimeClass that GPU workloads reference.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: nvidia
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: gpu-operator
      version: "v26.7.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: nvidia
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    cdi:
      enabled: true
    operator:
      runtimeClass: nvidia
    migManager:
      enabled: false
    # Time-slice the single RTX 5060 into 4 schedulable shares so Jellyfin,
    # Immich ML, whisper and Hermes can each request nvidia.com/gpu: 1. They
    # take turns on the card and share its 8 GB VRAM (no memory isolation).
    devicePlugin:
      config:
        create: true
        name: device-plugin-config
        default: default
        data:
          default: |-
            version: v1
            sharing:
              timeSlicing:
                resources:
                  - name: nvidia.com/gpu
                    replicas: 4
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
