apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Talos 1.13 moved GPU support to CDI + NVIDIA gpu-operator: the standalone
# nvidia-device-plugin chart and the hand-made `nvidia` RuntimeClass must be
# removed BEFORE upgrading (Talos upgrade notes). gpu-operator, added after
# the upgrade, recreates the `nvidia` RuntimeClass and the time-sliced plugin.
resources:
  - namespace.yaml
  - power-cap.yaml
