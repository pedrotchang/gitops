apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  releaseName: argo-workflows
  targetNamespace: argo-workflows
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: argo-workflows
      version: 1.0.20
      sourceRef:
        kind: HelmRepository
        name: argo-workflows
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      install: true
      keep: true
    createAggregateRoles: false
    singleNamespace: false
    controller:
      workflowNamespaces:
        - video-creator
      clusterWorkflowTemplates:
        enabled: false
      logging:
        format: json
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      rbac:
        accessAllSecrets: false
        secretWhitelist: []
        writeConfigMaps: false
    server:
      enabled: false
    workflow:
      serviceAccount:
        create: false
        name: video-creator-workflow
      rbac:
        create: false
