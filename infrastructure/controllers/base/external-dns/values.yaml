provider:
  name: cloudflare

policy: upsert-only

excludeDomains:
  - immich.seyzahl.com
  - nextcloud.seyzahl.com
  - wallabag.seyzahl.com
  - n8n.seyzahl.com
  - git.seyzahl.com
  # Media stack — Headscale-only, must never appear in public DNS. The
  # per-route external-dns exclude annotation is NOT honored for the
  # gateway-httproute source, so exclusion must live here.
  - jellyfin.seyzahl.com
  - jellyseerr.seyzahl.com
  - sonarr.seyzahl.com
  - radarr.seyzahl.com
  - prowlarr.seyzahl.com
  - bazarr.seyzahl.com
  - qbittorrent.seyzahl.com

sources:
  - service
  - ingress
  - gateway-httproute

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns-api-token
        key: cloudflare-dns-api-token
