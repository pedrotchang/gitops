provider:
  name: cloudflare

policy: upsert-only

excludeDomains:
  - immich.seyzahl.com
  - nextcloud.seyzahl.com
  - wallabag.seyzahl.com
  - n8n.seyzahl.com
  - git.seyzahl.com
  # Private-repo hosts — Headscale-only, must never appear in public DNS. The
  # per-route external-dns exclude annotation is NOT honored for the
  # gateway-httproute source, so exclusion must live here.
  - watch.seyzahl.com
  - request.seyzahl.com
  - shows.seyzahl.com
  - films.seyzahl.com
  - index.seyzahl.com
  - subs.seyzahl.com
  - dl.seyzahl.com

sources:
  - service
  - ingress
  - gateway-httproute

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns-api-token
        key: cloudflare-dns-api-token
