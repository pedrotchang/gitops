provider:
  name: cloudflare

policy: upsert-only

excludeDomains:
  - immich.seyzahl.com
  - forgejo.seyzahl.com
  - nextcloud.seyzahl.com
  - wallabag.seyzahl.com
  - pgadmin.seyzahl.com
  - n8n.seyzahl.com
  - suwayomi.seyzahl.com

sources:
  - service
  - ingress
  - gateway-httproute

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns-api-token
        key: cloudflare-dns-api-token
