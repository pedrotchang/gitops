apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 1h
  chart:
    spec:
      chart: base
      version: "1.30.*"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
