apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 1h
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.30.*"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
  values:
    pilot:
      # istiod backs the validating webhook every Flux dry-run of Istio objects
      # hits; if it can't schedule, the whole `apps` Kustomization stalls.
      # Let it fall back to the GPU node (2026-10-26: talos-09a-9ch went down,
      # talos-0pt-t35 was at 100% CPU requests, istiod Pending for 7h).
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
