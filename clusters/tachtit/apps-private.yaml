# Private overlay for tachtit (Forgejo platform-infrastructure/gitops-private).
# Same read-only deploy key as the public repo (Secret flux-system).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-private
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@git.seyzahl.com:2222/platform-infrastructure/gitops-private
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-private
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: gitops-private
  path: "./clusters/tachtit"
  prune: true
