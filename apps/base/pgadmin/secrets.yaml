apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin-container-env
  namespace: pgadmin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    template:
      data:
        PGADMIN_DEFAULT_EMAIL: "{{ .email }}"
        PGADMIN_DEFAULT_PASSWORD: "{{ .password }}"
        PGADMIN_SETUP_EMAIL: "{{ .email }}"
        PGADMIN_SETUP_PASSWORD: "{{ .password }}"
        PGADMIN_CONFIG_CONFIG_DATABASE_URI: "'postgresql://{{ .dbuser }}:{{ .dbpassword }}@pgadmin-pg.seyzahl.com:5432/pgadmin'"
        PGADMIN_CONFIG_OAUTH2_CONFIG: >-
          [{'OAUTH2_NAME': 'authentik', 'OAUTH2_DISPLAY_NAME': 'Authentik',
          'OAUTH2_CLIENT_ID': 'OfK1RQTvaMC4ssOSV4pMJxTMxzYZU55kwxnF4N5A',
          'OAUTH2_CLIENT_SECRET': '{{ .oidcSecret }}',
          'OAUTH2_TOKEN_URL': 'https://auth.seyzahl.com/application/o/token/',
          'OAUTH2_AUTHORIZATION_URL': 'https://auth.seyzahl.com/application/o/authorize/',
          'OAUTH2_API_BASE_URL': 'https://auth.seyzahl.com/',
          'OAUTH2_USERINFO_URL': 'https://auth.seyzahl.com/application/o/userinfo/',
          'OAUTH2_SCOPE': 'openid email profile',
          'OAUTH2_USERNAME_CLAIM': 'email',
          'OAUTH2_AUTO_CREATE_USER': True,
          'OAUTH2_ADDITIONAL_CLAIMS': {}}]
        PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['oauth2', 'internal']"
  data:
    - secretKey: email
      remoteRef:
        key: pgadmin-admin-email
    - secretKey: password
      remoteRef:
        key: pgadmin-admin-password
    - secretKey: dbuser
      remoteRef:
        key: pgadmin-db-username
    - secretKey: dbpassword
      remoteRef:
        key: pgadmin-db-password
    - secretKey: oidcSecret
      remoteRef:
        key: pgadmin-oidc-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel
  namespace: pgadmin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: credentials.json
      remoteRef:
        key: pgadmin-cloudflare-tunnel
