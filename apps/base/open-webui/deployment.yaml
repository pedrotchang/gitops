# Open WebUI — the household chat front end at chat.seyzahl.com (VPN/LAN only,
# authentik OIDC). Backends: LiteLLM (local / claude-sonnet / claude-opus) and,
# from stage 3, the Hermes API server. Speech-to-text (mic input AND attached
# recordings) goes to the in-cluster whisper; a one-hour file is transcoded to
# 16 kHz mono 32 kbps MP3 (~14 MB) by Open WebUI before upload, and anything
# over its 20 MB cap is split into chunks transcribed in parallel.
#
# Configuration is env-only (ENABLE_PERSISTENT_CONFIG=false): GitOps is the
# source of truth, the admin panel's Settings are not persisted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  # SQLite on an RWO volume: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      securityContext:
        runAsNonRoot: true
        # The image is built for UID 0 but chowns /app/backend to group 0 with
        # group-write so "arbitrary UIDs" (OpenShift style) work. Run as 1000:0.
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          # Upstream image pinned by digest; registered in custom-images for the
          # mirror gate — flip to the internal ref once it promotes.
          image: ghcr.io/open-webui/open-webui:v0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: open-webui-secrets
          env:
            - name: WEBUI_URL
              value: https://chat.seyzahl.com
            - name: WEBUI_NAME
              value: Chang household
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            # ── Auth: authentik OIDC only, no local login form ──────────────
            # First account to sign in becomes admin (Pedro signs in first);
            # everyone after gets DEFAULT_USER_ROLE.
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: user
            - name: OAUTH_PROVIDER_NAME
              value: authentik
            - name: OPENID_PROVIDER_URL
              value: https://auth.seyzahl.com/application/o/open-webui/.well-known/openid-configuration
            - name: OAUTH_SCOPES
              value: openid email profile
            # ── Models: everything through LiteLLM ──────────────────────────
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URLS
              value: http://litellm.llm.svc.cluster.local:4000/v1
            - name: DEFAULT_MODELS
              value: local
            # ── Speech-to-text → in-cluster whisper (keyless, CNP-gated) ────
            - name: AUDIO_STT_ENGINE
              value: openai
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: http://whisper.whisper.svc.cluster.local:8000/v1
            - name: AUDIO_STT_OPENAI_API_KEY
              value: unused
            - name: AUDIO_STT_MODEL
              value: deepdml/faster-whisper-large-v3-turbo-ct2
            # Attached files go straight into the model context (no embedding
            # model, no vector DB) — a transcript is read, not retrieved.
            - name: BYPASS_EMBEDDING_AND_RETRIEVAL
              value: "true"
            # ── No phoning home: the pod has no internet except auth.seyzahl.com
            - name: OFFLINE_MODE
              value: "true"
            - name: ENABLE_VERSION_UPDATE_CHECK
              value: "false"
            - name: ENABLE_COMMUNITY_SHARING
              value: "false"
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            # Channels (Slack-style rooms) — stage 4 lets Hermes post alerts here.
            - name: ENABLE_CHANNELS
              value: "true"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: tmp
          emptyDir: {}
