# Open WebUI secrets from Azure Key Vault via External Secrets Operator.
# - WEBUI_SECRET_KEY: KV "open-webui-secret-key" (session/JWT signing)
# - OAUTH_CLIENT_ID / OAUTH_CLIENT_SECRET: KV "open-webui-oidc-client-id" /
#   "open-webui-oidc-client-secret" — the SAME values the authentik blueprint
#   reads (authentik-env ExternalSecret), so both sides agree without git
#   ever holding them.
# - OPENAI_API_KEYS: KV "litellm-master-key" — bearer for the LiteLLM backend.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: open-webui-secrets
    creationPolicy: Owner
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: open-webui-secret-key
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: open-webui-oidc-client-id
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: open-webui-oidc-client-secret
    - secretKey: OPENAI_API_KEYS
      remoteRef:
        key: litellm-master-key
