# Open WebUI secrets from Azure Key Vault via External Secrets Operator.
# - WEBUI_SECRET_KEY: KV "open-webui-secret-key" (session/JWT signing)
# - OAUTH_CLIENT_ID / OAUTH_CLIENT_SECRET: KV "open-webui-oidc-client-id" /
#   "open-webui-oidc-client-secret" — the SAME values the authentik blueprint
#   reads (authentik-env ExternalSecret), so both sides agree without git
#   ever holding them.
# - OPENAI_API_KEYS: KV "litellm-master-key" + "hermes-api-server-key" joined
#   with ";" (templated below) — bearers for the two OpenAI-compatible backends.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: open-webui-secrets
    creationPolicy: Owner
    # Open WebUI takes one semicolon-separated key list matching
    # OPENAI_API_BASE_URLS (LiteLLM first, Hermes second).
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .WEBUI_SECRET_KEY }}"
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        OPENAI_API_KEYS: "{{ .LITELLM_MASTER_KEY }};{{ .HERMES_API_SERVER_KEY }}"
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: open-webui-secret-key
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: open-webui-oidc-client-id
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: open-webui-oidc-client-secret
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm-master-key
    - secretKey: HERMES_API_SERVER_KEY
      remoteRef:
        key: hermes-api-server-key
