apiVersion: headscale.infrado.cloud/v1beta1
kind: Headscale
metadata:
  name: headscale
  namespace: headscale
spec:
  version: "v0.26.0"
  replicas: 1
  config:
    server_url: https://headscale.seyzahl.com
    listen_addr: 0.0.0.0:8080
    grpc_listen_addr: 0.0.0.0:50443
    grpc_allow_insecure: true
    disable_check_updates: true
    database:
      type: postgres
      postgres:
        host: headscale-pg.seyzahl.com
        port: 5432
        name: headscale
        user: headscale
        ssl: false
    dns:
      magic_dns: true
      base_domain: vpn.seyzahl.com
      nameservers:
        global:
          - 1.1.1.1
          - 8.8.8.8
      extra_records:
        - name: nextcloud.seyzahl.com
          type: A
          value: "10.104.130.214"
        - name: immich.seyzahl.com
          type: A
          value: "10.104.130.214"
        - name: forgejo.seyzahl.com
          type: A
          value: "10.104.130.214"
        - name: n8n.seyzahl.com
          type: A
          value: "10.104.130.214"
        - name: commafeed.seyzahl.com
          type: A
          value: "10.104.130.214"
        - name: wallabag.seyzahl.com
          type: A
          value: "10.104.130.214"
        - name: git.seyzahl.com
          type: A
          value: "10.111.51.228"
        - name: truenas.seyzahl.com
          type: A
          value: "192.168.7.14"
    oidc:
      only_start_if_oidc_is_available: true
      issuer: https://auth.seyzahl.com/application/o/headscale/
      client_id: headscale
      client_secret_path: /etc/headscale/oidc-secret/client_secret
      scope:
        - openid
        - profile
        - email
      expiry: "180d"
    policy:
      mode: database
  acl_policy:
    inline: |
      {
        "groups": {
          "group:routers": ["subnet-router@"]
        },
        "tagOwners": {
          "tag:subnet-router": ["group:routers"]
        },
        "acls": [{"action": "accept", "src": ["*"], "dst": ["*:*"]}],
        "autoApprovers": {
          "routes": {
            "10.244.0.0/16": ["tag:subnet-router"],
            "10.96.0.0/12": ["tag:subnet-router"]
          }
        }
      }
  api_key:
    auto_manage: false
  extra_env:
    - name: HEADSCALE_DATABASE_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: headscale-db-creds
          key: password
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: headscale-db-creds
          key: password
  extra_volumes:
    - name: oidc-secret
      secret:
        secretName: headscale-oidc-secret
    - name: run-headscale
      emptyDir: {}
  extra_volume_mounts:
    - name: oidc-secret
      mountPath: /etc/headscale/oidc-secret
      readOnly: true
    - name: run-headscale
      mountPath: /var/run/headscale
