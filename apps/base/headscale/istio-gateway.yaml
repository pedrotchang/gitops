apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-tls
  namespace: headscale
spec:
  secretName: headscale-tls
  dnsNames:
    - headscale.seyzahl.com
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-gateway-options
  namespace: headscale
data:
  # Overlay merged by istiod into the generated gateway Deployment: two
  # replicas, one per node, GPU node as overflow only.
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: headscale-gateway
              matchLabelKeys:
                - pod-template-hash
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: DoesNotExist
  podDisruptionBudget: |
    spec:
      minAvailable: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: headscale-gateway
  namespace: headscale
spec:
  gatewayClassName: istio
  infrastructure:
    labels:
      cilium-lb-pool: apps-pool
    parametersRef:
      group: ""
      kind: ConfigMap
      name: headscale-gateway-options
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: headscale.seyzahl.com
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: headscale-tls
---
# /admin -> headplane UI
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headplane-route
  namespace: headscale
spec:
  parentRefs:
    - name: headscale-gateway
      sectionName: https
  hostnames:
    - headscale.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: headplane
          port: 3000
---
# /* -> headscale control plane (TS2021 upgrade happens here)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale-route
  namespace: headscale
spec:
  parentRefs:
    - name: headscale-gateway
      sectionName: https
  hostnames:
    - headscale.seyzahl.com
  rules:
    - backendRefs:
        - name: headscale
          port: 8080
---
# Allow Upgrade: tailscale-control-protocol through Envoy
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: headscale-upgrade
  namespace: headscale
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: headscale-gateway
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
            upgrade_configs:
              - upgrade_type: "tailscale-control-protocol"
