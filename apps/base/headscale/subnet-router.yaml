apiVersion: headscale.infrado.cloud/v1beta1
kind: HeadscaleUser
metadata:
  name: subnet-router
  namespace: headscale
spec:
  headscaleRef: headscale
  username: subnet-router
---
apiVersion: headscale.infrado.cloud/v1beta1
kind: HeadscalePreAuthKey
metadata:
  name: subnet-router-key
  namespace: headscale
spec:
  headscaleRef: headscale
  headscaleUserRef: subnet-router
  reusable: true
  expiration: "8760h"
  tags:
    - "tag:subnet-router"
  secretName: subnet-router-key
---
apiVersion: headscale.infrado.cloud/v1beta1
kind: HeadscaleAutoApprover
metadata:
  name: subnet-router
  namespace: headscale
spec:
  headscaleRef: headscale
  routes:
    - cidr: 10.244.0.0/16
      tags: ["tag:subnet-router"]
    - cidr: 10.96.0.0/12
      tags: ["tag:subnet-router"]
    - cidr: 192.168.4.0/24
      tags: ["tag:subnet-router"]
    - cidr: 192.168.7.14/32
      tags: ["tag:subnet-router"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-subnet-router
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-subnet-router
  namespace: headscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    # one state Secret per StatefulSet replica (TS_KUBE_SECRET = pod name)
    resourceNames: ["tailscale-subnet-router-0", "tailscale-subnet-router-1"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-subnet-router
  namespace: headscale
subjects:
  - kind: ServiceAccount
    name: tailscale-subnet-router
    namespace: headscale
roleRef:
  kind: Role
  name: tailscale-subnet-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
# Two routers advertising the same routes: headscale keeps one primary and
# fails over to the other when it goes offline. A StatefulSet gives each
# replica a stable node identity (hostname + state Secret = pod name).
kind: StatefulSet
metadata:
  name: tailscale-subnet-router
  namespace: headscale
  labels:
    app: tailscale-subnet-router
spec:
  serviceName: tailscale-subnet-router
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
        policy-type: "app"
    spec:
      serviceAccountName: tailscale-subnet-router
      # One replica per node; the GPU node is overflow only (tolerated, but
      # the non-GPU nodes are preferred).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tailscale-subnet-router
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.98.4
          env:
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.seyzahl.com"
            - name: TS_ROUTES
              value: "10.244.0.0/16,10.96.0.0/12,192.168.4.0/24,192.168.7.14/32"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: subnet-router-key
                  key: key
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_USERSPACE
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TS_HOSTNAME
              value: $(POD_NAME)
            - name: TS_KUBE_SECRET
              value: $(POD_NAME)
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/tailscale
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          emptyDir: {}
