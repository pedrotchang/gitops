apiVersion: headscale.infrado.cloud/v1beta1
kind: HeadscaleUser
metadata:
  name: subnet-router
  namespace: headscale
spec:
  headscaleRef: headscale
  username: subnet-router
---
apiVersion: headscale.infrado.cloud/v1beta1
kind: HeadscalePreAuthKey
metadata:
  name: subnet-router-key
  namespace: headscale
spec:
  headscaleRef: headscale
  headscaleUserRef: subnet-router
  reusable: true
  expiration: "8760h"
  tags:
    - "tag:subnet-router"
  secretName: subnet-router-key
---
apiVersion: headscale.infrado.cloud/v1beta1
kind: HeadscaleAutoApprover
metadata:
  name: subnet-router
  namespace: headscale
spec:
  headscaleRef: headscale
  routes:
    - cidr: 10.244.0.0/16
      tags: ["tag:subnet-router"]
    - cidr: 10.96.0.0/12
      tags: ["tag:subnet-router"]
    - cidr: 192.168.4.0/24
      tags: ["tag:subnet-router"]
    - cidr: 192.168.7.14/32
      tags: ["tag:subnet-router"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-subnet-router
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-subnet-router
  namespace: headscale
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    # The router's single state Secret (node key). The "-0" name is left over
    # from the StatefulSet era and kept so the node keeps its identity.
    resourceNames: ["tailscale-subnet-router-0"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-subnet-router
  namespace: headscale
subjects:
  - kind: ServiceAccount
    name: tailscale-subnet-router
    namespace: headscale
roleRef:
  kind: Role
  name: tailscale-subnet-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
# ONE router (2026-11-17). A second router never covered the failure that
# actually happens: when forwarding wedges, the node still looks online, so
# headscale does not fail over. vpn-canary.yaml heals wedges instead.
#
# A Deployment and not a StatefulSet: if the node dies, a StatefulSet never
# recreates its pod elsewhere (VPN down until a human clears the node). A
# Deployment's ReplicaSet does, once the dead node's pod is evicted.
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: headscale
  labels:
    app: tailscale-subnet-router
spec:
  replicas: 1
  # Recreate: never run two pods at once. Both would load the same state
  # Secret and fight over one node key.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
        policy-type: "app"
    spec:
      serviceAccountName: tailscale-subnet-router
      # tailscaled exits in ~1 s on SIGTERM; keep any overlap with a
      # replacement pod (eviction, node drain) short.
      terminationGracePeriodSeconds: 5
      # Move off a dead node after 60 s instead of the default 300 s.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.98.4
          env:
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://headscale.seyzahl.com"
            - name: TS_ROUTES
              value: "10.244.0.0/16,10.96.0.0/12,192.168.4.0/24,192.168.7.14/32"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: subnet-router-key
                  key: key
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_USERSPACE
              value: "false"
            # Talos 1.12+ kernels ship no legacy iptables tables; tailscale's
            # default (iptables-legacy) then fails to install its NAT rules
            # and forwarding silently breaks. Force the nftables backend.
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
            # Fixed names (not the pod name): the Deployment's pods get random
            # names, but the router must stay the same headscale node with its
            # already-approved routes.
            - name: TS_HOSTNAME
              value: tailscale-subnet-router-0
            - name: TS_KUBE_SECRET
              value: tailscale-subnet-router-0
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/tailscale
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          emptyDir: {}
