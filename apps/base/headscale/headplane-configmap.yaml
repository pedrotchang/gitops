apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 3000
      base_url: "https://headscale.seyzahl.com"
      cookie_secret_path: "/etc/headplane/cookie-secret/secret"
      cookie_secure: true
      data_path: "/var/lib/headplane"

    headscale:
      url: "http://headscale.headscale.svc.cluster.local:8080"
      api_key_path: "/etc/headplane/api-key/api-key"

    oidc:
      enabled: true
      issuer: "https://auth.seyzahl.com/application/o/headscale/"
      client_id: "headscale"
      client_secret_path: "/etc/headplane/oidc-secret/client_secret"
      use_pkce: true
      scope: "openid email profile"
      disable_api_key_login: false

    integration:
      docker:
        enabled: false
      kubernetes:
        enabled: false
      proc:
        enabled: false
