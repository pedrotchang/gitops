apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-db-creds
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: password
      remoteRef:
        key: headscale-db-password
