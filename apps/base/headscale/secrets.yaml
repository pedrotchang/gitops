apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc-secret
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: headscale-oidc-secret
  data:
    - secretKey: client_secret
      remoteRef:
        key: headscale-oidc-client-secret
---
