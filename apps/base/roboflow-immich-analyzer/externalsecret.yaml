# Both KV secrets MUST exist before the pods can start (secretKeyRef).
#   roboflow-api-key          — Roboflow API key; used once to download CLIP
#                               weights into the cache PVC. Inference stays local.
#   immich-analyzer-api-keys  — comma-separated Immich API keys, one per user
#                               whose library should be triaged. Permissions:
#                               user.read asset.read asset.view album.read
#                               album.create albumAsset.create
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roboflow-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: roboflow-api-key
    creationPolicy: Owner
  data:
    - secretKey: ROBOFLOW_API_KEY
      remoteRef:
        key: roboflow-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-analyzer-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: immich-analyzer-api-keys
    creationPolicy: Owner
  data:
    - secretKey: IMMICH_API_KEYS
      remoteRef:
        key: immich-analyzer-api-keys
