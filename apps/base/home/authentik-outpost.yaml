# Authentik proxy outpost for the home namespace (forward-auth in front of
# Frigate). Mirrors apps/tachtit/homepage/authentik-outpost.yaml. The outpost
# authenticates frigate.seyzahl.com against auth.seyzahl.com, then reverse-
# proxies to Frigate's internal_host (set in blueprint-frigate) and injects
# X-authentik-username, which Frigate reads via proxy.header_map.
#
# The token is generated by authentik when blueprint-frigate creates the "home"
# outpost, then staged into Key Vault by scripts/home/stage-outpost-token.ts
# (KV: home-outpost-token) → this ExternalSecret. The Deployment CrashLoops
# until the token is staged — expected on first apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-outpost-token
  namespace: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: home-outpost-token
  data:
    - secretKey: token
      remoteRef:
        key: home-outpost-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-outpost-home
  namespace: home
  labels:
    app: authentik-outpost-home
    app.kubernetes.io/name: authentik-outpost-home
    app.kubernetes.io/instance: home
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-outpost-home
  template:
    metadata:
      labels:
        app: authentik-outpost-home
        app.kubernetes.io/name: authentik-outpost-home
        app.kubernetes.io/instance: home
        app.kubernetes.io/component: proxy
        # Inherits the home-apps CiliumNetworkPolicy: ingress from gateway,
        # egress to Frigate (in-cluster) + auth.seyzahl.com (world:443) + DNS.
        policy-type: "app"
    spec:
      containers:
        - name: outpost
          image: ghcr.io/goauthentik/proxy:2025.10.3
          env:
            - name: AUTHENTIK_HOST
              value: https://auth.seyzahl.com
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-outpost-token
                  key: token
          volumeMounts:
            - name: sessions
              mountPath: /dev/shm
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: https
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 9300
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /outpost.goauthentik.io/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: sessions
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost-home
  namespace: home
  labels:
    app: authentik-outpost-home
    app.kubernetes.io/name: authentik-outpost-home
    app.kubernetes.io/instance: home
    app.kubernetes.io/component: proxy
spec:
  selector:
    app: authentik-outpost-home
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
    - name: https
      port: 9443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9300
      targetPort: metrics
      protocol: TCP
