apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
        policy-type: app
    spec:
      initContainers:
        # Seed GitOps-owned config into the PVC copy-ALWAYS. These files are the
        # source of truth; HA persists account + UI state in /config/.storage, not
        # here, so overwriting them each boot keeps external_url + auth_oidc SSO
        # declarative (a copy-if-absent seed never reaches an already-running HA).
        - name: seed-config
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /config/packages
              cp /seed/configuration.yaml /config/configuration.yaml
              cp /seed/nursery.yaml /config/packages/nursery.yaml
              echo "config seeded (copy-always)"
          volumeMounts:
            - name: seed
              mountPath: /seed
            - name: config
              mountPath: /config
        # Seed the hass-oidc-auth component (authentik SSO client) from the
        # carrier image, copy-ALWAYS: the image is the source of truth, so bumping
        # its tag deploys the new component version. The component holds no user
        # state — OIDC settings live in HA's .storage — so overwriting each boot
        # is idempotent.
        - name: seed-oidc
          image: forgejo.seyzahl.com/platform-infrastructure/home-assistant-oidc:1.1.1
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /config/custom_components
              rm -rf /config/custom_components/auth_oidc
              cp -r /component/auth_oidc /config/custom_components/auth_oidc
              echo "auth_oidc seeded (v1.1.1)"
          volumeMounts:
            - name: config
              mountPath: /config
        # Seed the Frigate HA integration (blakeblackshear/frigate-hass-integration)
        # copy-ALWAYS from the pinned GitHub release. HA has no native Frigate
        # support and we deliberately avoid HACS (runtime click-ops that drops
        # untracked files on the box); vendoring the component here keeps it
        # declarative + version-pinned. Component is code only (config lives in HA's
        # .storage) so re-vendoring each boot is idempotent — bump VER to upgrade.
        # NOTE: upstream alpine + GitHub fetch at boot is acknowledged supply-chain
        # debt (same tier as the busybox/HA/Frigate upstream images); harden to a
        # carrier image (like seed-oidc) later — see PR.md.
        - name: seed-frigate
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              VER=5.15.4
              URL="https://codeload.github.com/blakeblackshear/frigate-hass-integration/tar.gz/refs/tags/v${VER}"
              mkdir -p /config/custom_components
              rm -rf /config/custom_components/frigate
              cd /tmp
              wget -qO f.tgz "$URL" || { apk add --no-cache curl >/dev/null && curl -fsSL -o f.tgz "$URL"; }
              tar xzf f.tgz
              cp -r "frigate-hass-integration-${VER}/custom_components/frigate" /config/custom_components/frigate
              echo "frigate integration seeded (v${VER})"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.6
          env:
            - name: TZ
              value: "America/Los_Angeles"
          ports:
            - containerPort: 8123
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: seed
          configMap:
            name: home-assistant-seed
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
