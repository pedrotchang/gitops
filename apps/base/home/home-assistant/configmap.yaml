apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-seed
  namespace: home
data:
  # GitOps-owned config, seeded copy-ALWAYS into the PVC by an init container
  # (see deployment.yaml). HA persists account + UI state in /config/.storage —
  # NOT these files — so re-seeding from git each boot keeps config declarative.
  configuration.yaml: |
    default_config:

    # HA sits behind the Cilium gateway; without this the reverse-proxied login
    # is rejected. trusted_proxies = pod CIDR (the gateway's source range).
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16

    # Nap Mode + nursery automations live in a package.
    # external_url pins the base URL so hass-oidc-auth builds the OIDC
    # redirect_uri as https://ha.seyzahl.com/auth/oidc/callback (must match the
    # strict redirect registered in the authentik blueprint, or login is rejected).
    homeassistant:
      external_url: "https://ha.seyzahl.com"
      internal_url: "https://ha.seyzahl.com"
      packages: !include_dir_named packages

    # authentik OIDC SSO (hass-oidc-auth). PUBLIC client — no client_secret, so
    # PKCE is used (on by default). With copy-always seeding this registers the
    # provider on boot and "authentik" appears on the login screen — zero clicks.
    # force_https guarantees the redirect scheme is https behind the Cilium
    # gateway, matching the strict redirect in the authentik blueprint.
    auth_oidc:
      client_id: "RluG9D5GmhxoeUq9GZ4N6RtK4Hsc1IUr7b15BuKq"
      discovery_url: "https://auth.seyzahl.com/application/o/home-assistant/.well-known/openid-configuration"
      display_name: "authentik"
      features:
        force_https: true
        # Skip the (unstyled) welcome page and auto-redirect straight to
        # authentik's login. Also fixes "Login aborted" on the default login
        # page (HA auto-starting the OIDC provider without the cookie). Password
        # fallback stays reachable at https://ha.seyzahl.com/?skip_oidc_redirect=true
        default_redirect: true

  nursery.yaml: |
    # ── Baby monitor: Nap Mode + motion alerts ──────────────────────────────
    # The camera only arms while Nap Mode is on. Motion-only (no object
    # detection), so alerts trigger off Frigate's per-camera motion topic.
    input_boolean:
      nap_mode:
        name: Nap Mode
        icon: mdi:sleep

    automation:
      - id: nursery_arm_with_nap_mode
        alias: "Nursery — arm/disarm recordings with Nap Mode"
        trigger:
          - platform: state
            entity_id: input_boolean.nap_mode
        action:
          # Frigate runtime control over MQTT: gate recording + snapshots on nap.
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/recordings/set"
              payload: "{{ 'ON' if is_state('input_boolean.nap_mode','on') else 'OFF' }}"
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/snapshots/set"
              payload: "{{ 'ON' if is_state('input_boolean.nap_mode','on') else 'OFF' }}"

      - id: nursery_motion_alert
        alias: "Nursery — motion alert (Nap Mode only)"
        # mode:single + trailing delay = ~1 alert per 5 min, so a wriggling baby
        # doesn't spam you. Normal priority (not a DND-piercing critical alert).
        mode: single
        max_exceeded: silent
        trigger:
          - platform: mqtt
            topic: "frigate/nursery/motion"
            payload: "ON"
        condition:
          - condition: state
            entity_id: input_boolean.nap_mode
            state: "on"
        action:
          # Rename mobile_app_phone to your device once the Companion app is
          # registered (Settings → Companion App → device name).
          - service: notify.mobile_app_phone
            data:
              title: "Nursery"
              message: "Motion detected in the nursery"
              data:
                # Latest snapshot via the HA Frigate integration proxy.
                image: "/api/frigate/nursery/latest.jpg"
          - delay: "00:05:00"

    # ── PTZ control (E1 pan/tilt) ───────────────────────────────────────────
    # Frigate bridges ONVIF PTZ onto MQTT (frigate/nursery/ptz). Each script
    # fires a continuous MOVE then a STOP after a short beat = one discrete
    # nudge. These show up as script.nursery_ptz_* entities — drop them on a
    # dashboard as arrow buttons, or call them from voice/automations.
    script:
      nursery_ptz_left:
        alias: "Nursery — pan left"
        icon: mdi:arrow-left-bold
        sequence:
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "MOVE_LEFT"
          - delay: "00:00:00.5"
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "STOP"
      nursery_ptz_right:
        alias: "Nursery — pan right"
        icon: mdi:arrow-right-bold
        sequence:
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "MOVE_RIGHT"
          - delay: "00:00:00.5"
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "STOP"
      nursery_ptz_up:
        alias: "Nursery — tilt up"
        icon: mdi:arrow-up-bold
        sequence:
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "MOVE_UP"
          - delay: "00:00:00.5"
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "STOP"
      nursery_ptz_down:
        alias: "Nursery — tilt down"
        icon: mdi:arrow-down-bold
        sequence:
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "MOVE_DOWN"
          - delay: "00:00:00.5"
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/ptz"
              payload: "STOP"
