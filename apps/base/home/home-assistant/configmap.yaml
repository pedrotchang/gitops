apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-seed
  namespace: home
data:
  # GitOps-owned config, seeded copy-ALWAYS into the PVC by an init container
  # (see deployment.yaml). HA persists account + UI state in /config/.storage —
  # NOT these files — so re-seeding from git each boot keeps config declarative.
  configuration.yaml: |
    default_config:

    # HA sits behind the Cilium gateway; without this the reverse-proxied login
    # is rejected. trusted_proxies = pod CIDR (the gateway's source range).
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16

    # Nap Mode + nursery automations live in a package.
    # external_url pins the base URL so hass-oidc-auth builds the OIDC
    # redirect_uri as https://ha.seyzahl.com/auth/oidc/callback (must match the
    # strict redirect registered in the authentik blueprint, or login is rejected).
    homeassistant:
      external_url: "https://ha.seyzahl.com"
      internal_url: "https://ha.seyzahl.com"
      packages: !include_dir_named packages

    # authentik OIDC SSO removed 2026-07-06 — it fought the login flow too much
    # ("Login aborted", forced redirects). HA now uses local username/password
    # only (accounts: pedro=owner, hanna). To re-add SSO later, restore the
    # auth_oidc block + the seed-oidc initContainer + the authentik application.

  nursery.yaml: |
    # ── Baby monitor: Nap Mode + motion alerts ──────────────────────────────
    # The camera only arms while Nap Mode is on. Motion-only (no object
    # detection), so alerts trigger off Frigate's per-camera motion topic.
    input_boolean:
      nap_mode:
        name: Nap Mode
        icon: mdi:sleep

    automation:
      - id: nursery_arm_with_nap_mode
        alias: "Nursery — arm/disarm camera with Nap Mode"
        # Re-asserts Frigate's runtime toggles whenever Nap Mode changes, HA
        # starts, or Frigate (re)connects. The last two matter: Frigate resets
        # these toggles to their config defaults on every restart (motion
        # defaults ON), so without re-asserting, a Frigate/HA reboot would
        # silently leave the motion detector running with Nap Mode off — the
        # exact bug. frigate/available is a retained birth topic, so HA also
        # re-syncs on every MQTT reconnect.
        trigger:
          - platform: state
            entity_id: input_boolean.nap_mode
          - platform: homeassistant
            event: start
          - platform: mqtt
            topic: "frigate/available"
            payload: "online"
        action:
          # Frigate runtime control over MQTT: gate motion detection + recording
          # + snapshots on Nap Mode. motion/set OFF only succeeds when object
          # detection is already off — it is (detect.enabled: false in Frigate).
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/motion/set"
              payload: "{{ 'ON' if is_state('input_boolean.nap_mode','on') else 'OFF' }}"
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/recordings/set"
              payload: "{{ 'ON' if is_state('input_boolean.nap_mode','on') else 'OFF' }}"
          - service: mqtt.publish
            data:
              topic: "frigate/nursery/snapshots/set"
              payload: "{{ 'ON' if is_state('input_boolean.nap_mode','on') else 'OFF' }}"

      - id: nursery_motion_alert
        alias: "Nursery — motion alert (Nap Mode only)"
        # mode:single + trailing delay = ~1 alert per 5 min, so a wriggling baby
        # doesn't spam you. Normal priority (not a DND-piercing critical alert).
        mode: single
        max_exceeded: silent
        trigger:
          - platform: mqtt
            topic: "frigate/nursery/motion"
            payload: "ON"
        condition:
          - condition: state
            entity_id: input_boolean.nap_mode
            state: "on"
        action:
          # Push to BOTH parents' Companion apps. Service = notify.mobile_app_<slug>
          # where <slug> is the device name slugified by HA — verified against HA's
          # entity registry (notify.pedro_iphone / notify.hanna_changs_iphone), NOT
          # the old placeholder "phone" (which silently ServiceNotFound'd → no alert).
          # Note Hanna's slug drops the apostrophe: hanna_changs_iphone. If a phone is
          # re-registered the slug may gain a numeric suffix — re-check the registry.
          # Legacy mobile_app_* service (not notify.send_message) so data.image works.
          - service: notify.mobile_app_pedro_iphone
            data:
              title: "Nursery"
              message: "Motion detected in the nursery"
              data:
                # Latest snapshot via the HA Frigate integration proxy.
                image: "/api/frigate/nursery/latest.jpg"
          - service: notify.mobile_app_hanna_changs_iphone
            data:
              title: "Nursery"
              message: "Motion detected in the nursery"
              data:
                image: "/api/frigate/nursery/latest.jpg"
          - delay: "00:05:00"

    # ── PTZ control (E1 pan/tilt) ───────────────────────────────────────────
    # This camera keeps ONVIF (8000) and Baichuan (9000) closed, so both
    # Frigate ONVIF-PTZ and the native HA Reolink integration fail on it. PTZ
    # instead goes through the Reolink HTTP API on port 80 (verified: rspCode
    # 200 + physical movement) via the seeded helper /config/reolink_ptz.sh.
    # Each shell_command sends one MOVE + STOP = a discrete nudge. The script.*
    # wrappers are the dashboard-friendly entities — drop them on a card as
    # arrow buttons, or call from voice/automations.
    shell_command:
      nursery_ptz_left: "bash /config/reolink_ptz.sh Left"
      nursery_ptz_right: "bash /config/reolink_ptz.sh Right"
      nursery_ptz_up: "bash /config/reolink_ptz.sh Up"
      nursery_ptz_down: "bash /config/reolink_ptz.sh Down"

    script:
      nursery_ptz_left:
        alias: "Nursery — pan left"
        icon: mdi:arrow-left-bold
        sequence:
          - service: shell_command.nursery_ptz_left
      nursery_ptz_right:
        alias: "Nursery — pan right"
        icon: mdi:arrow-right-bold
        sequence:
          - service: shell_command.nursery_ptz_right
      nursery_ptz_up:
        alias: "Nursery — tilt up"
        icon: mdi:arrow-up-bold
        sequence:
          - service: shell_command.nursery_ptz_up
      nursery_ptz_down:
        alias: "Nursery — tilt down"
        icon: mdi:arrow-down-bold
        sequence:
          - service: shell_command.nursery_ptz_down

  # Port-80 PTZ helper (see nursery.yaml → shell_command). Seeded to
  # /config/reolink_ptz.sh copy-always. Sends one MOVE then STOP = a nudge.
  # Creds/host from env (home-assistant-reolink secret) — no secrets in git.
  reolink_ptz.sh: |
    #!/bin/sh
    set -eu
    OP="${1:?usage: reolink_ptz.sh <Left|Right|Up|Down|Stop>}"
    case "$OP" in Left|Right|Up|Down|Stop) ;; *) echo "bad op: $OP" >&2; exit 2 ;; esac
    PW_ENC=$(printf '%s' "$REOLINK_PW" | jq -sRr @uri)
    API="http://${REOLINK_HOST}/cgi-bin/api.cgi?cmd=PtzCtrl&user=${REOLINK_USER}&password=${PW_ENC}"
    send() { curl -s -m 5 -X POST -H 'Content-Type: application/json' -d "$1" "$API" >/dev/null; }
    send "[{\"cmd\":\"PtzCtrl\",\"param\":{\"channel\":0,\"op\":\"${OP}\",\"speed\":32}}]"
    [ "$OP" = "Stop" ] && exit 0
    sleep 0.5
    send "[{\"cmd\":\"PtzCtrl\",\"param\":{\"channel\":0,\"op\":\"Stop\"}}]"
