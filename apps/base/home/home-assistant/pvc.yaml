apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  # truenas-iscsi (block, not node-pinned) — HA config + its SQLite recorder DB. NOT NFS.
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 5Gi
