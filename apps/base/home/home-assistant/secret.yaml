apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-reolink
  namespace: home
spec:
  # Reolink E1 admin creds, injected into the HA container as env vars
  # (REOLINK_USER/REOLINK_PW) for the port-80 PTZ helper. Same Azure KV entries
  # Frigate uses for RTSP — a dedicated ExternalSecret keeps HA decoupled from
  # frigate-creds. The native Reolink integration is unusable here (it needs the
  # camera's Baichuan port 9000, which this firmware keeps closed, same as ONVIF
  # 8000), so PTZ goes through the Reolink HTTP API on port 80 instead.
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: home-assistant-reolink
  data:
    - secretKey: cam-user
      remoteRef:
        key: nursery-cam-user
    - secretKey: cam-password
      remoteRef:
        key: nursery-cam-password
