apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: home
data:
  # NOTE: Frigate config keys shift between minor versions. Validate this against
  # the pinned image's schema on camera day (see PR.md). Written for 0.16.x.
  config.yml: |
    mqtt:
      enabled: true
      host: mosquitto.home.svc.cluster.local
      port: 1883
      user: mqtt
      password: "{FRIGATE_MQTT_PASSWORD}"
      topic_prefix: frigate

    # go2rtc restream — one pull from the camera, fanned out to detect + record
    # + WebRTC live view (low-latency). Creds/host come from env substitution.
    go2rtc:
      streams:
        nursery:
          - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM_HOST}:554/h264Preview_01_main"
        nursery_sub:
          - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM_HOST}:554/h264Preview_01_sub"

    cameras:
      nursery:
        enabled: true
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/nursery_sub
              input_args: preset-rtsp-restream
              roles:
                - detect
            - path: rtsp://127.0.0.1:8554/nursery
              input_args: preset-rtsp-restream
              roles:
                - record
                - audio
        detect:
          # Object detection ENABLED — NOT because we track objects, but because
          # Frigate only RUNS motion detection (and publishes frigate/nursery/motion)
          # inside the detect process. With detect disabled it never fired a single
          # motion event (verified: 4 min of real movement, zero events). CPU
          # detector (auto-default), only runs on motion, cheap at 5fps. Alerts key
          # off raw MOTION, not objects. Nap Mode gates this via detect/set (gating
          # detect — not motion/set — avoids Frigate's "can't disable motion while
          # detect is on" rule).
          enabled: true
          width: 640
          height: 480
          fps: 5
        motion:
          # Frigate defaults. An earlier sensitive tune (threshold 20 /
          # contour_area 5) sat in the low-light/IR sensor-noise floor and pegged
          # detection at process_fps (motion "on" every frame with a still baby) —
          # useless. Defaults are the quiescent-at-rest baseline: motion fires on
          # real movement (baby stirring), not noise. If it MISSES small stirs,
          # lower threshold toward ~25 and/or contour_area toward ~8 a step at a
          # time; if it's NOISY, raise threshold / contour_area or add a mask.
          threshold: 30
          contour_area: 10
          improve_contrast: true
        record:
          enabled: true
          retain:
            days: 10
            mode: motion
        snapshots:
          # No event snapshots needed; latest.jpg (live frame) still serves the HA
          # notification image.
          enabled: false
        audio:
          # Built-in CPU audio model → cry ESCALATION alert. Needs the `audio` role
          # on an audio-carrying stream (main has an AAC mic track). Publishes
          # frigate/nursery/audio/crying ON/OFF; HA sends a critical push on it.
          # Nap Mode gates it at runtime via frigate/nursery/audio/set.
          enabled: true
          listen:
            - crying
        # No onvif block: this E1 firmware keeps ONVIF (8000) closed even with
        # the toggle on + a reboot, so Frigate ONVIF-PTZ can't connect. PTZ is
        # done instead through the Reolink HTTP API on port 80, driven from Home
        # Assistant (see home-assistant configmap → reolink_ptz.sh).

    # No explicit detectors block → Frigate auto-creates one CPU detector (no
    # Coral/GPU). Fine for a single 5fps camera where detection only runs on motion.
