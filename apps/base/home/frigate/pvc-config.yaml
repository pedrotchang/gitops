apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  # truenas-iscsi (block, not node-pinned) — Frigate's SQLite DB (frigate.db) + config. NOT NFS.
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 2Gi
