apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-creds
  namespace: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: frigate-creds
  data:
    # Shared MQTT password (same KV entry Mosquitto uses). Exists now.
    - secretKey: mqtt-password
      remoteRef:
        key: mqtt-password
    # ── CAMERA DAY: add these two entries to Azure KV `seyzahl`, then uncomment ──
    # - secretKey: cam-user
    #   remoteRef:
    #     key: nursery-cam-user
    # - secretKey: cam-password
    #   remoteRef:
    #     key: nursery-cam-password
