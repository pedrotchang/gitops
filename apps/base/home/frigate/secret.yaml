apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-creds
  namespace: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: frigate-creds
  data:
    # Shared MQTT password (same KV entry Mosquitto uses). Exists now.
    - secretKey: mqtt-password
      remoteRef:
        key: mqtt-password
    # Reolink E1 RTSP creds (staged in Azure KV `seyzahl` 2026-07-05).
    - secretKey: cam-user
      remoteRef:
        key: nursery-cam-user
    - secretKey: cam-password
      remoteRef:
        key: nursery-cam-password
