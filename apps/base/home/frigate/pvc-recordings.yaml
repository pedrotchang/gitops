apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-recordings
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  # Bulk motion clips → truenas-nfs. Only large, append-only media lives here;
  # the SQLite DB stays on local-path (NFS breaks SQLite locking).
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 50Gi
