apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: home
spec:
  # Camera live (Reolink E1, reserved 192.168.10.107, WAN-blocked in UniFi).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
        policy-type: app
    spec:
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:0.16.0
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: FRIGATE_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-creds
                  key: mqtt-password
            # Reolink E1 — DHCP-reserved 192.168.10.107 on Main (192.168.10.0/24),
            # blocked from WAN in UniFi (no managed switch → no VLAN isolation).
            - name: FRIGATE_CAM_HOST
              value: "192.168.10.107"
            - name: FRIGATE_CAM_USER
              valueFrom:
                secretKeyRef:
                  name: frigate-creds
                  key: cam-user
            - name: FRIGATE_CAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-creds
                  key: cam-password
          ports:
            - containerPort: 5000
              name: http
            - containerPort: 8554
              name: rtsp
            - containerPort: 8555
              name: webrtc-tcp
              protocol: TCP
            - containerPort: 8555
              name: webrtc-udp
              protocol: UDP
          # Gate the Service endpoint on Frigate's unauthenticated :5000 actually
          # answering. Without readiness, a restart adds the pod to the Service
          # before nginx:5000 is up (~30-60s), so anything proxying to it — the
          # Authentik outpost for frigate.seyzahl.com AND the HA Frigate
          # integration — gets "connection refused" / Bad Gateway in that window.
          # startupProbe gives Frigate's slow init (go2rtc + detectors) headroom
          # so liveness never kills a still-booting pod.
          startupProbe:
            httpGet:
              path: /api/version
              port: 5000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/version
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/version
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-file
              mountPath: /config/config.yml
              subPath: config.yml
              readOnly: true
            - name: recordings
              mountPath: /media/frigate
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /tmp/cache
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: config-file
          configMap:
            name: frigate-config
        - name: recordings
          persistentVolumeClaim:
            claimName: frigate-recordings
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
