apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  # truenas-iscsi (block, not node-pinned) — Mosquitto persistence store; NFS not needed.
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 1Gi
