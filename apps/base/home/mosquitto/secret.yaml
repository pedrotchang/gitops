apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-creds
  namespace: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: mosquitto-creds
    template:
      data:
        username: mqtt
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: mqtt-password
