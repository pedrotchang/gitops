apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  labels:
    app: forgejo
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgejo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: forgejo
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/instance: forgejo
        app.kubernetes.io/component: server
        policy-type: app
    spec:
      securityContext:
        fsGroup: 1000

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: forgejo
                topologyKey: kubernetes.io/hostname

      containers:
        - name: forgejo
          image: data.forgejo.org/forgejo/forgejo:15.0.3-rootless

          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA_CUSTOM
              value: /var/lib/gitea/custom
            - name: FORGEJO__cron__ENABLED
              value: "false"

          envFrom:
            - configMapRef:
                name: forgejo-configmap
            - secretRef:
                name: forgejo-db-env

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi

          volumeMounts:
            - name: forgejo-config
              mountPath: /var/lib/gitea/custom
            - name: forgejo-data
              mountPath: /data

      restartPolicy: Always

      volumes:
        - name: forgejo-config
          emptyDir: {}
        - name: forgejo-data
          nfs:
            server: 192.168.7.14
            path: /mnt/tank/git
            readOnly: false
