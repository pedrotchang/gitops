# Immich via the official chart. App version is pinned by image.tag (chart version != app version).
# DB stays external (CNPG + VectorChord); Redis is the chart-managed Valkey.

# Run as uid/gid 1000 to match the NFS library owner (the raw deployment did this).
# Without it the chart runs immich as root, NFS root-squashes it, and writes to the
# 1000-owned library 500 with EACCES (mkdir permission denied) -> uploads fail.
defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.4
        envFrom:
          - configMapRef:
              name: immich-configmap
          - secretRef:
              name: immich-container-env
          - secretRef:
              name: immich-oidc

immich:
  persistence:
    library:
      existingClaim: immich-library-pvc-nfs

server:
  enabled: true
  # Runs on the Aorus GPU node (household AI node). RollingUpdate with the
  # default 25% surge = new pod Ready before the old one stops → no downtime.
  controllers:
    main:
      pod:
        nodeSelector:
          nvidia.com/gpu.present: "true"
  persistence:
    # Library mounts MUST match the absolute paths stored in the DB:
    #   originalPath -> /usr/src/app/upload/...   (64327 assets)
    #   external lib -> /external/...             (38435 assets, subPath upload)
    data:
      # Chart 0.13 validates values against a schema: the library volume must
      # name its type + claim explicitly (0.12 inferred them from immich.persistence).
      type: persistentVolumeClaim
      existingClaim: immich-library-pvc-nfs
      globalMounts:
        - path: /usr/src/app/upload
        - path: /external
          subPath: upload

valkey:
  enabled: true

machine-learning:
  enabled: true
  # CUDA build on the time-sliced RTX 5060 (smart search / face recognition).
  # Tag must track the server's image.tag (+ "-cuda").
  controllers:
    main:
      pod:
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.present: "true"
      containers:
        main:
          image:
            tag: v3.2.4-cuda
          resources:
            limits:
              nvidia.com/gpu: 1
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-cache-pvc-nfs
