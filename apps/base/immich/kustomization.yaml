apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich

resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - storage-nfs.yaml
  - repository.yaml
  - release.yaml

configMapGenerator:
  - name: immich-values
    files:
      - values.yaml=values.yaml

configurations:
  - kustomizeconfig.yaml

generatorOptions:
  disableNameSuffixHash: false
