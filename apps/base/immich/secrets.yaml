apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-container-env
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: immich-db-username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: immich-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-oidc
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: immich-oidc
  data:
    - secretKey: client_id
      remoteRef:
        key: immich-oidc-client-id
    - secretKey: client_secret
      remoteRef:
        key: immich-oidc-client-secret
