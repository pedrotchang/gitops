apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-configmap
  namespace: immich
data:
  # Database configuration
  DB_HOSTNAME: "immich-pg.seyzahl.com"
  DB_PORT: "5432"
  DB_DATABASE_NAME: "immich"

  # Media/upload location — must match the library mount + absolute paths in the DB.
  # Redis (Valkey) and machine-learning URL are now provided by the chart.
  UPLOAD_LOCATION: "/usr/src/app/upload"

  # Logging
  LOG_LEVEL: "log"
