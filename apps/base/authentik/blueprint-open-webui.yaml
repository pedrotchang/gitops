apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-open-webui
  namespace: authentik
data:
  open-webui.yaml: |
    # Managed in GitOps — OIDC provider + application for Open WebUI
    # (chat.seyzahl.com). client_id/secret come from the authentik-env
    # ExternalSecret (KV open-webui-oidc-client-id/-secret), the same KV values
    # Open WebUI itself consumes. Open to every authentik user (Pedro + Hanna);
    # Open WebUI assigns admin to the first login and `user` after that.
    version: 1
    metadata:
      name: open-webui OIDC (GitOps managed)
    entries:
      - id: open-webui-oauth2-provider
        model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: "open-webui OIDC"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env OPEN_WEBUI_OIDC_CLIENT_ID
          client_secret: !Env OPEN_WEBUI_OIDC_CLIENT_SECRET
          access_code_validity: "minutes=1"
          access_token_validity: "hours=24"
          refresh_token_validity: "days=30"
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # authentik 2026.5+: blueprint providers default to NO grant types
          # and every login fails with invalid_request unless set explicitly.
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://chat.seyzahl.com/oauth/oidc/callback"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - id: open-webui-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: open-webui
        attrs:
          name: Chat
          provider: !KeyOf open-webui-oauth2-provider
          meta_launch_url: https://chat.seyzahl.com
          meta_description: Household chat — Hermes, local model, Claude, whisper
