apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik

resources:
  - namespace.yaml
  - secrets.yaml
  - storage-nfs.yaml
  - blueprint-immich.yaml
  - blueprint-media.yaml
  - blueprint-home-assistant.yaml
  - blueprint-frigate.yaml
  - blueprint-manga.yaml
  - repository.yaml
  - release.yaml

configMapGenerator:
  - name: authentik-values
    files:
      - values.yaml=values.yaml

configurations:
  - kustomizeconfig.yaml

generatorOptions:
  disableNameSuffixHash: false
