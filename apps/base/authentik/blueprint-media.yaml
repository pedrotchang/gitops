apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-media
  namespace: authentik
data:
  media.yaml: |
    # Managed in GitOps — the media namespace's entire auth surface, so it
    # cannot drift in the admin UI (same rationale as the immich blueprint).
    #
    #   proxy providers (mode: proxy)  → sonarr, radarr, prowlarr, bazarr,
    #                                    jellyseerr
    #   oauth2/OIDC provider           → jellyfin (9p4 SSO plugin)
    #   one proxy outpost "media"      → served by authentik-outpost-media
    #                                    Deployment in the media namespace
    #
    # Flow/cert references use !Find (instance defaults) instead of UUIDs.
    # The outpost's token is fetched into Key Vault by
    # scripts/media/stage-secrets.ts (KV: media-outpost-token) → ESO → the
    # outpost Deployment.
    version: 1
    metadata:
      name: media stack (GitOps managed)
    entries:
      # ── Proxy providers ──────────────────────────────────────────────
      - id: sonarr-provider
        model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "sonarr proxy"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://sonarr.seyzahl.com
          internal_host: http://sonarr.media.svc.cluster.local:8989
          internal_host_ssl_validation: false
      - id: radarr-provider
        model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "radarr proxy"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://radarr.seyzahl.com
          internal_host: http://radarr.media.svc.cluster.local:7878
          internal_host_ssl_validation: false
      - id: prowlarr-provider
        model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "prowlarr proxy"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://prowlarr.seyzahl.com
          internal_host: http://prowlarr.media.svc.cluster.local:9696
          internal_host_ssl_validation: false
      - id: bazarr-provider
        model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "bazarr proxy"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://bazarr.seyzahl.com
          internal_host: http://bazarr.media.svc.cluster.local:6767
          internal_host_ssl_validation: false
      - id: jellyseerr-provider
        model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "jellyseerr proxy"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://jellyseerr.seyzahl.com
          internal_host: http://jellyseerr.media.svc.cluster.local:5055
          internal_host_ssl_validation: false

      # ── Jellyfin native OIDC (9p4 jellyfin-plugin-sso) ───────────────
      - id: jellyfin-oauth2-provider
        model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: "jellyfin OIDC"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: "jellyfin-media-sso"
          client_secret: !Env JELLYFIN_OIDC_CLIENT_SECRET
          access_code_validity: "minutes=1"
          access_token_validity: "hours=24"
          refresh_token_validity: "days=30"
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # authentik 2026.x denies every grant when this list is empty, and
          # blueprint-created oauth2 providers get NO default (the admin UI
          # pre-checks authorization_code; blueprints do not). Without this the
          # SSO login dies at /authorize: "Invalid grant_type for provider".
          # ProxyProviders are unaffected — their save() fills grant types.
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://jellyfin.seyzahl.com/sso/OID/redirect/authentik"
            - matching_mode: strict
              url: "https://jellyfin.seyzahl.com/sso/OID/r/authentik"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # ── Applications ─────────────────────────────────────────────────
      - id: sonarr-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: sonarr
        attrs:
          name: Sonarr
          provider: !KeyOf sonarr-provider
          meta_launch_url: https://sonarr.seyzahl.com
      - id: radarr-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: radarr
        attrs:
          name: Radarr
          provider: !KeyOf radarr-provider
          meta_launch_url: https://radarr.seyzahl.com
      - id: prowlarr-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: prowlarr
        attrs:
          name: Prowlarr
          provider: !KeyOf prowlarr-provider
          meta_launch_url: https://prowlarr.seyzahl.com
      - id: bazarr-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: bazarr
        attrs:
          name: Bazarr
          provider: !KeyOf bazarr-provider
          meta_launch_url: https://bazarr.seyzahl.com
      # qbittorrent removed (2026-10-12): absent so authentik deletes it
      - id: qbittorrent-app
        model: authentik_core.application
        state: absent
        identifiers:
          slug: qbittorrent
      - id: jellyseerr-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: jellyseerr
        attrs:
          name: Jellyseerr
          provider: !KeyOf jellyseerr-provider
          meta_launch_url: https://jellyseerr.seyzahl.com
      - id: jellyfin-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: jellyfin
        attrs:
          name: Jellyfin
          provider: !KeyOf jellyfin-oauth2-provider
          meta_launch_url: https://jellyfin.seyzahl.com

      # ── Outpost (embedded proxy for the media namespace) ─────────────
      - id: media-outpost
        model: authentik_outposts.outpost
        state: present
        identifiers:
          name: media
        attrs:
          type: proxy
          providers:
            - !KeyOf sonarr-provider
            - !KeyOf radarr-provider
            - !KeyOf prowlarr-provider
            - !KeyOf bazarr-provider
            - !KeyOf jellyseerr-provider
          config:
            authentik_host: https://auth.seyzahl.com
            authentik_host_insecure: false
      # qbittorrent removed (2026-10-12): delete the provider after the app
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers:
          name: "qbittorrent proxy"
