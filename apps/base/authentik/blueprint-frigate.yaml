apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-frigate
  namespace: authentik
data:
  frigate.yaml: |
    # Managed in GitOps — Frigate's auth surface, so it cannot drift in the
    # admin UI (same rationale as the media/immich blueprints).
    #
    #   proxy provider (mode: proxy)  → frigate  (forward-auth; Frigate has no
    #                                   native OIDC client, so the outpost is the
    #                                   gatekeeper and injects X-authentik-username,
    #                                   which Frigate reads via proxy.header_map)
    #   one proxy outpost "home"      → served by authentik-outpost-home
    #                                   Deployment in the home namespace
    #
    # Flow/cert references use !Find (instance defaults) instead of UUIDs.
    # The outpost's token is fetched into Key Vault by
    # scripts/home/stage-outpost-token.ts (KV: home-outpost-token) → ESO → the
    # outpost Deployment. Rerun that script after this blueprint first applies.
    version: 1
    metadata:
      name: frigate (GitOps managed)
    entries:
      # ── Proxy provider ───────────────────────────────────────────────
      - id: frigate-provider
        model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "frigate proxy"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://frigate.seyzahl.com
          # Forward to Frigate's UNAUTHENTICATED internal port (5000). The outpost
          # is the auth layer; 5000 serves the UI and trusts the outpost-injected
          # user header. (8971 is Frigate's own login+TLS port — unused here.)
          internal_host: http://frigate.home.svc.cluster.local:5000
          internal_host_ssl_validation: false

      # ── Application ──────────────────────────────────────────────────
      - id: frigate-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: frigate
        attrs:
          name: Frigate
          provider: !KeyOf frigate-provider
          meta_launch_url: https://frigate.seyzahl.com

      # ── Outpost (proxy for the home namespace) ───────────────────────
      - id: home-outpost
        model: authentik_outposts.outpost
        state: present
        identifiers:
          name: home
        attrs:
          type: proxy
          providers:
            - !KeyOf frigate-provider
          config:
            authentik_host: https://auth.seyzahl.com
            authentik_host_insecure: false
