postgresql:
  enabled: false
redis:
  enabled: false

authentik:
  existingSecret:
    secretName: authentik-env

server:
  replicas: 2
  # One replica per node (hard). matchLabelKeys
  # keeps rolling updates from counting the old ReplicaSet's pods.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeAffinityPolicy: Honor
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/component: server
      matchLabelKeys:
        - pod-template-hash
  pdb:
    enabled: true
    minAvailable: 1
  envFrom:
    - secretRef:
        name: authentik-env
    # Env for blueprints that live in the private repo (gitops-private).
    # Optional so authentik starts without it.
    - secretRef:
        name: authentik-private-env
        optional: true
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: authentik-pg.seyzahl.com
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: authentik
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      value: "false"
    - name: AUTHENTIK_LOG_LEVEL
      value: info
    - name: AUTHENTIK_LISTEN__HTTP
      value: "0.0.0.0:9000"
    - name: AUTHENTIK_LISTEN__HTTPS
      value: "0.0.0.0:9443"
    - name: AUTHENTIK_LISTEN__METRICS
      value: "0.0.0.0:9300"
  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: authentik-media-pvc-nfs
    - name: templates
      persistentVolumeClaim:
        claimName: authentik-templates-pvc-nfs
    # Blueprints from the private repo (gitops-private), discovered like the
    # chart-mounted ones below. Optional so authentik starts without them.
    - name: blueprints-private
      configMap:
        name: authentik-blueprint-private
        optional: true
  volumeMounts:
    - name: media
      mountPath: /data/media
    - name: templates
      mountPath: /templates
    - name: blueprints-private
      mountPath: /blueprints/mounted/cm-authentik-blueprint-private

worker:
  replicas: 2
  # One replica per node (hard). matchLabelKeys
  # keeps rolling updates from counting the old ReplicaSet's pods.
