postgresql:
  enabled: false
redis:
  enabled: false

authentik:
  existingSecret:
    secretName: authentik-env

server:
  replicas: 2
  # One replica per node (hard), GPU node as overflow only. matchLabelKeys
  # keeps rolling updates from counting the old ReplicaSet's pods.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/component: server
      matchLabelKeys:
        - pod-template-hash
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: nvidia.com/gpu.present
                operator: DoesNotExist
  pdb:
    enabled: true
    minAvailable: 1
  envFrom:
    - secretRef:
        name: authentik-env
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: authentik-pg.seyzahl.com
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: authentik
    - name: AUTHENTIK_ERROR_REPORTING__ENABLED
      value: "false"
    - name: AUTHENTIK_LOG_LEVEL
      value: info
    - name: AUTHENTIK_LISTEN__HTTP
      value: "0.0.0.0:9000"
    - name: AUTHENTIK_LISTEN__HTTPS
      value: "0.0.0.0:9443"
    - name: AUTHENTIK_LISTEN__METRICS
      value: "0.0.0.0:9300"
  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: authentik-media-pvc-nfs
    - name: templates
      persistentVolumeClaim:
        claimName: authentik-templates-pvc-nfs
  volumeMounts:
    - name: media
      mountPath: /data/media
    - name: templates
      mountPath: /templates

worker:
  replicas: 2
  # One replica per node (hard), GPU node as overflow only. matchLabelKeys
  # keeps rolling updates from counting the old ReplicaSet's pods.
  topologySpreadConstraints:
