      value: "0.0.0.0:9000"
    - name: AUTHENTIK_LISTEN__METRICS
      value: "0.0.0.0:9300"
  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: authentik-media-pvc-nfs
    - name: templates
      persistentVolumeClaim:
