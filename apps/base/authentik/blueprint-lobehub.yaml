apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-lobehub
  namespace: authentik
data:
  lobehub.yaml: |
    # Managed in GitOps — OIDC provider + application for LobeHub
    # (lobe.seyzahl.com). client_id/secret come from the authentik-env
    # ExternalSecret (KV lobehub-oidc-client-id/-secret), the same KV values
    # LobeHub itself consumes. Open to every authentik user (Pedro + Hanna),
    # matching Open WebUI. LobeHub uses Better Auth's generic OIDC client with
    # PKCE and redirects to /api/auth/callback/authentik (it overrides Better
    # Auth's default /api/auth/oauth2/callback/{id}; both are registered so a
    # future upstream change does not lock everyone out).
    version: 1
    metadata:
      name: lobehub OIDC (GitOps managed)
    entries:
      - id: lobehub-oauth2-provider
        model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: "lobehub OIDC"
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env LOBEHUB_OIDC_CLIENT_ID
          client_secret: !Env LOBEHUB_OIDC_CLIENT_SECRET
          access_code_validity: "minutes=1"
          access_token_validity: "hours=24"
          refresh_token_validity: "days=30"
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # authentik 2026.5+: blueprint providers default to NO grant types
          # and every login fails with invalid_request unless set explicitly.
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://lobe.seyzahl.com/api/auth/callback/authentik"
            - matching_mode: strict
              url: "https://lobe.seyzahl.com/api/auth/oauth2/callback/authentik"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - id: lobehub-app
        model: authentik_core.application
        state: present
        identifiers:
          slug: lobehub
        attrs:
          name: LobeHub
          provider: !KeyOf lobehub-oauth2-provider
          meta_launch_url: https://lobe.seyzahl.com
          meta_description: LobeHub (trial) — agents, knowledge base, memory; same models as Chat
