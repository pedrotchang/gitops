# Speaches API key (bearer) from Azure Key Vault via External Secrets Operator.
# KV secret "whisper-api-key" MUST exist before this lands: without it the Secret
# is never created and the whisper pod cannot start (Recreate strategy → outage).
# Consumers: whisper (API_KEY), hermes-agent (VOICE_TOOLS_OPENAI_KEY), transcribe.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whisper-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: whisper-api-key
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: whisper-api-key
