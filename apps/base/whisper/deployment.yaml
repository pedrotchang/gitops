# Self-hosted Whisper (Speaches, OpenAI-compatible STT) — transcribes Telegram voice
# memos for Hermes. Runs large-v3-turbo on the Aorus RTX 5060 (GPU makes large's
# accuracy affordable; on CPU it flirted with Hermes' hardcoded 30s STT timeout).
# The model lives in the `whisper-models` PVC; audio is processed in an emptyDir
# /tmp and never persisted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  # The GPU is a single non-shared device: stop the old pod before starting the new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      runtimeClassName: nvidia
      priorityClassName: gpu-workload
      nodeSelector:
        nvidia.com/gpu.present: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper
          # Upstream image pinned by digest; mirror via supply-chain later (#177).
          image: ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3@sha256:c0da392c37e76a01ba479239b43124c67baf8913ae0f491071d6ac544641dad7
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HUB_CACHE
              value: /models/hub
            - name: WHISPER__INFERENCE_DEVICE
              value: cuda
            # Unload the model after 5 min idle so the GPU drops back to its P8
            # idle state (fanless ITX case); reload from the PVC takes seconds.
            - name: WHISPER__TTL
              value: "300"
            # Local-only: never fetch from Hugging Face. Only the model already on the
            # PVC can load; anything else fails instead of downloading. (Egress is
            # also denied by the CiliumNetworkPolicy — belt and braces.)
            - name: HF_HUB_OFFLINE
              value: "1"
            # Gradio UI at / (browser upload → transcript) for whisper.seyzahl.com,
            # reachable only through the cilium-gateway (VPN/LAN). The UI pages
            # themselves bypass API_KEY; the /v1 API still requires the bearer.
            - name: ENABLE_UI
              value: "true"
            # Gradio phones home on startup; egress is denied anyway, skip the wait.
            - name: GRADIO_ANALYTICS_ENABLED
              value: "0"
            # The UI calls the API as an HTTP client. Behind the gateway it would
            # derive the URL from the request Host (whisper.seyzahl.com) and fail:
            # egress is denied, so there is no DNS. Talk to itself over loopback.
            - name: LOOPBACK_HOST_URL
              value: "http://127.0.0.1:8000"
            # Python's allocator keeps freed memory per thread arena, so the
            # process grew 1.6 GB -> ~3.7 GB across a few long jobs and the next
            # 47-min transcription (+~3 GB) was OOMKilled at the 6Gi limit
            # (2026-11-12). Two arenas curb that growth.
            - name: MALLOC_ARENA_MAX
              value: "2"
            # No API_KEY on purpose (2026-11-12): the 0.8.3 Gradio UI formats the
            # SecretStr into "Bearer **********" and 403s against its own API.
            # Access is gated by the CiliumNetworkPolicy (hermes-agent, transcribe,
            # cilium-gateway) and the VPN in front of the gateway. Hermes still
            # sends VOICE_TOOLS_OPENAI_KEY; Speaches ignores it. Re-add the key
            # once a Speaches release reads api_key.get_secret_value() in the UI.
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # One hour-long transcription adds ~3 GB of RAM on top of a
              # 1.6-3.7 GB baseline (measured 2026-11-12); 6Gi was OOMKilled.
              memory: 10Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
            # Audio is processed here and discarded — ephemeral, never persisted.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-models
        - name: tmp
          emptyDir: {}
