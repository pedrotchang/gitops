# Self-hosted Whisper (Speaches, OpenAI-compatible STT) — transcribes Telegram voice
# memos for Hermes. Stateless: the large-v3-turbo model is baked into the image and
# audio is processed in an emptyDir /tmp, so NO PVC and nothing audio-related persists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper
          # Speaches + baked faster-whisper large-v3-turbo (offline, no runtime HF).
          image: forgejo.seyzahl.com/platform-infrastructure/speaches:large-v3-turbo
          ports:
            - name: http
              containerPort: 8000
          env:
            # ctranslate2 reads the NODE core count (nproc=16) and over-subscribes,
            # then gets CFS-throttled onto this container's 4-core limit — so the
            # language-detection encoder pass crawled (~18s) and blew past Hermes'
            # hardcoded 30s STT client timeout. Pin threads to the CPU limit so it
            # uses 4 cores efficiently instead of thrashing 16. Speeds detect + decode.
            - name: WHISPER__CPU_THREADS
              value: "4"
            - name: OMP_NUM_THREADS
              value: "4"
            # Keep the model resident instead of offloading after 300s idle (which
            # forced a ~3s reload on the next memo). ~1.5GB steady RAM, well within
            # the 5Gi limit. -1 = never evict.
            - name: WHISPER__TTL
              value: "-1"
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 5Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Audio is processed here and discarded — ephemeral, never persisted.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
