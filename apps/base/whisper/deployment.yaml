# Self-hosted Whisper (Speaches, OpenAI-compatible STT) — transcribes Telegram voice
# memos for Hermes. Runs large-v3-turbo on the Aorus RTX 5060 (GPU makes large's
# accuracy affordable; on CPU it flirted with Hermes' hardcoded 30s STT timeout).
# The model lives in the `whisper-models` PVC; audio is processed in an emptyDir
# /tmp and never persisted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  # The GPU is a single non-shared device: stop the old pod before starting the new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whisper
          # Upstream image pinned by digest; mirror via supply-chain later (#177).
          image: ghcr.io/speaches-ai/speaches:0.8.3-cuda-12.6.3@sha256:c0da392c37e76a01ba479239b43124c67baf8913ae0f491071d6ac544641dad7
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HUB_CACHE
              value: /models/hub
            - name: WHISPER__INFERENCE_DEVICE
              value: cuda
            # Unload the model after 5 min idle so the GPU drops back to its P8
            # idle state (fanless ITX case); reload from the PVC takes seconds.
            - name: WHISPER__TTL
              value: "300"
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 6Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
            # Audio is processed here and discarded — ephemeral, never persisted.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-models
        - name: tmp
          emptyDir: {}
