apiVersion: v1
kind: Namespace
metadata:
  name: finance
  labels:
    # The app pod meets the restricted Pod Security Standard; enforce it so a
    # later change cannot quietly run something privileged here.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
