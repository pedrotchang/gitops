# Same Key Vault entries the data-cluster CNPG Cluster bootstraps its owner from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finance-db-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: finance-db-creds
  data:
    - secretKey: PGUSER
      remoteRef:
        key: finance-db-username
    - secretKey: PGPASSWORD
      remoteRef:
        key: finance-db-password
---
# App secrets: the at-rest encryption key for bank links stored in Postgres,
# and the household Anthropic key for sorting help.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finance-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: finance-app-secrets
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef:
        key: finance-encryption-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: finance-anthropic-api-key
