apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 30m
  chart:
    spec:
      chart: nextcloud
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  values:
    image:
      repository: nextcloud
      tag: stable

    nextcloud:
      host: nextcloud.seyzahl.com
      existingSecret:
        enabled: true
        secretName: nextcloud-admin-creds
        usernameKey: username
        passwordKey: password
      phpConfigs:
        uploadLimit.ini: |
          upload_max_filesize = 16G
          post_max_size = 16G
          max_input_time = 3600
          max_execution_time = 3600
      configs:
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => ['10.0.0.0/8'],
            'overwriteprotocol' => 'https',
          );
        oidc.config.php: |-
          <?php
          $CONFIG = array (
            'user_oidc' => array (
              'single_logout' => false,
              'auto_provision' => true,
            ),
          );
        # Allow the in-cluster service hostname as a trusted domain so Hermes can
        # reach CalDAV pod->service directly (http://nextcloud.nextcloud.svc:8080),
        # bypassing the Cloudflare Tunnel whose WAF blocks CalDAV clients (err 1010).
        # Full explicit list so the public domain is never dropped by config merge.
        trusteddomains.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_domains' => array (
              0 => 'localhost',
              1 => 'nextcloud.seyzahl.com',
              2 => 'nextcloud.nextcloud.svc.cluster.local',
            ),
          );

    internalDatabase:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-pg.seyzahl.com
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-db-env
        usernameKey: DB_USERNAME
        passwordKey: DB_PASSWORD

    redis:
      enabled: true
      auth:
        enabled: false
      architecture: standalone

    persistence:
      enabled: true
      storageClass: local-path
      size: 20Gi
      nextcloudData:
        enabled: true
        storageClass: truenas-nfs
        size: 100Gi

    cronjob:
      enabled: true

    startupProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
      successThreshold: 1

    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
