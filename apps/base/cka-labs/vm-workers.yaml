apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: worker-1
  namespace: cka-labs
spec:
  runStrategy: Manual
  dataVolumeTemplates:
    - metadata:
        name: worker-1-disk
      spec:
        storage:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        source:
          pvc:
            namespace: cka-labs
            name: ubuntu-22-04-base
  template:
    metadata:
      labels:
        kubevirt.io/domain: worker-1
        role: worker
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: worker-1-disk
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: cka-labs-cloud-init
