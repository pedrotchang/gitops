# Scheduled agent tasks + goal sweeps. LobeHub Cloud gets these ticks from
# Upstash QStash schedules (scripts/serverLauncher/startServer.js: task
# schedule-dispatch every 10 min, goal sweep every 5); self-hosted without
# QSTASH_TOKEN nothing calls them, so scheduled tasks would never fire.
# This CronJob makes the same two calls, signed with LobeHub's internal
# callback scheme (src/libs/qstash/internalSignature.ts: HMAC-SHA256 keyed off
# KEY_VAULTS_SECRET, header x-lobe-callback-signature, 5-minute freshness).
# Dispatch is deduplicated server-side per occurrence, so ticking every
# 5 minutes is safe; a task due at 09:03 fires on the 09:05 tick.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lobehub-tick
  labels:
    app: lobehub-tick
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 280
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: lobehub-tick
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: tick
              # Same image as the app: guarantees node + matches its scheme.
              image: docker.io/lobehub/lobehub:2.3.3@sha256:0981b4653a233d8d2b226416fdad0bf34875fcabb1dedc7f5c3320d8c8d23c60
              command:
                - /bin/node
                - -e
                - |
                  const { createHmac } = require('node:crypto');
                  const secret = process.env.KEY_VAULTS_SECRET;
                  const base = 'http://lobehub.lobehub.svc.cluster.local:3210';
                  const paths = ['/api/workflows/task/schedule-dispatch', '/api/workflows/goal/sweep'];
                  const key = createHmac('sha256', secret).update('lobehub:internal-callback:v1').digest();
                  let failed = false;
                  (async () => {
                    for (const path of paths) {
                      const body = '{}';
                      const ts = String(Date.now());
                      const mac = createHmac('sha256', key).update(JSON.stringify([ts, 'POST', path, body])).digest('hex');
                      try {
                        const res = await fetch(base + path, {
                          method: 'POST',
                          headers: { 'content-type': 'application/json', 'x-lobe-callback-signature': `${ts}.${mac}` },
                          body,
                          signal: AbortSignal.timeout(120000),
                        });
                        console.log(path, res.status, (await res.text()).slice(0, 400));
                        if (!res.ok) failed = true;
                      } catch (error) {
                        console.error(path, String(error));
                        failed = true;
                      }
                    }
                    process.exit(failed ? 1 : 0);
                  })();
              env:
                - name: KEY_VAULTS_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: lobehub-secrets
                      key: KEY_VAULTS_SECRET
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
