# LobeHub namespace — default-deny everywhere, internet locked down like Open
# WebUI. The only off-cluster destinations are authentik's public host (OIDC;
# the issuer is the public URL) and the CNPG primary on the data cluster
# (192.168.4.168, pinned in databases/data/lobehub/database.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lobehub
spec:
  endpointSelector:
    matchLabels:
      app: lobehub
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Browsers via the cilium-gateway.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3210"
              protocol: TCP
    # Gateway calls back into the API; the tick CronJob posts schedule ticks.
    - fromEndpoints:
        - matchLabels:
            app: lobehub-gateway
        - matchLabels:
            app: lobehub-tick
      toPorts:
        - ports:
            - port: "3210"
              protocol: TCP
    # Kubelet probes.
    - fromEntities:
        - host
        - remote-node
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: llm
            app: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: lobehub-rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: lobehub-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: lobehub-gateway
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
            - port: "8788"
              protocol: TCP
    - toCIDR:
        - 192.168.4.168/32
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.seyzahl.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lobehub-gateway
spec:
  endpointSelector:
    matchLabels:
      app: lobehub-gateway
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Browsers (WebSocket) via the cilium-gateway — agent port only.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: lobehub
      toPorts:
        - ports:
            - port: "8787"
              protocol: TCP
            - port: "8788"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: lobehub
      toPorts:
        - ports:
            - port: "3210"
              protocol: TCP
---
# RustFS: browsers (presigned PUT/GET) via the gateway, the app, the bucket
# init Job. Reaches nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lobehub-rustfs
spec:
  endpointSelector:
    matchLabels:
      app: lobehub-rustfs
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: lobehub
        - matchLabels:
            app: lobehub-rustfs-init
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
---
# Valkey: the app only. Reaches nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lobehub-valkey
spec:
  endpointSelector:
    matchLabels:
      app: lobehub-valkey
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: lobehub
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
---
# Short-lived jobs: DNS + their one target, nothing inbound.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lobehub-jobs
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - lobehub-tick
          - lobehub-rustfs-init
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: lobehub
      toPorts:
        - ports:
            - port: "3210"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: lobehub-rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
