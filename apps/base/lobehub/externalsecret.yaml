# LobeHub secrets from Azure Key Vault via External Secrets Operator. Nothing
# secret lives in git; every value below was generated once into KV.
# - KEY_VAULTS_SECRET / AUTH_SECRET: KV lobehub-key-vaults-secret / -auth-secret.
#   KEY_VAULTS_SECRET encrypts stored provider keys AND signs internal callbacks
#   (the schedule-tick CronJobs) — never rotate it casually.
# - JWKS_KEY: KV lobehub-jwks-key (RS256 private JWK set, signs internal JWTs);
#   the gateway gets only lobehub-jwks-public-key.
# - AUTH_AUTHENTIK_ID/SECRET: KV lobehub-oidc-client-id/-secret — the SAME values
#   the authentik blueprint reads (authentik-env ExternalSecret).
# - DATABASE_URL: KV lobehub-db-username/-password → the CNPG cluster on the
#   data cluster (same KV values the data-cluster ExternalSecret bootstraps).
# - OPENAI_API_KEY: KV litellm-master-key (LiteLLM is the only model provider).
# - S3 keys: KV lobehub-s3-access-key/-secret-key — RustFS's root credentials.
# - Gateway token: KV lobehub-gateway-service-token, shared with the gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lobehub-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: lobehub-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KEY_VAULTS_SECRET: "{{ .KEY_VAULTS_SECRET }}"
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        JWKS_KEY: "{{ .JWKS_KEY }}"
        AUTH_AUTHENTIK_ID: "{{ .OIDC_CLIENT_ID }}"
        AUTH_AUTHENTIK_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        DATABASE_URL: "postgresql://{{ .DB_USER }}:{{ .DB_PASSWORD }}@lobehub-pg.seyzahl.com:5432/lobehub"
        OPENAI_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMORY_USER_MEMORY_GATEKEEPER_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMORY_USER_MEMORY_LAYER_EXTRACTOR_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMORY_USER_MEMORY_PERSONA_WRITER_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMORY_USER_MEMORY_CONSOLIDATION_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMORY_USER_MEMORY_EMBEDDING_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY }}"
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_KEY }}"
        AGENT_GATEWAY_SERVICE_TOKEN: "{{ .GATEWAY_TOKEN }}"
        DEVICE_GATEWAY_SERVICE_TOKEN: "{{ .GATEWAY_TOKEN }}"
  data:
    - secretKey: KEY_VAULTS_SECRET
      remoteRef:
        key: lobehub-key-vaults-secret
    - secretKey: AUTH_SECRET
      remoteRef:
        key: lobehub-auth-secret
    - secretKey: JWKS_KEY
      remoteRef:
        key: lobehub-jwks-key
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: lobehub-oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: lobehub-oidc-client-secret
    - secretKey: DB_USER
      remoteRef:
        key: lobehub-db-username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: lobehub-db-password
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm-master-key
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: lobehub-s3-access-key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: lobehub-s3-secret-key
    - secretKey: GATEWAY_TOKEN
      remoteRef:
        key: lobehub-gateway-service-token
---
# The agent gateway verifies browser session JWTs with the PUBLIC key only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lobehub-gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: lobehub-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: lobehub-gateway-service-token
    - secretKey: JWKS_PUBLIC_KEY
      remoteRef:
        key: lobehub-jwks-public-key
---
# RustFS root credentials (also LobeHub's S3 keys) and the rc client alias.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lobehub-rustfs-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: lobehub-rustfs-secrets
    creationPolicy: Owner
  data:
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: lobehub-s3-access-key
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: lobehub-s3-secret-key
