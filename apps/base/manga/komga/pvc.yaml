# local-path (node SSD), NOT truenas-nfs: Komga 1.x hard-refuses its SQLite
# database on a remote filesystem (ConfigurationChecker: "detected nfs4") and
# SQLite on our nolock NFS mounts is genuinely corruption-prone — same reason
# jellyfin-config is on local-path. The shared manga library stays NFS RWX.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: komga-config
  namespace: manga
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
