# Komga application.yml — authentik OIDC per the official integration guide
# (https://integrations.goauthentik.io/media/komga/). Browser logins use SSO;
# API keys / basic auth keep working for Komf, OPDS, and reader apps.
# user-name-attribute is `sub` (stable UUID) rather than preferred_username —
# the guide warns username changes break auth otherwise; Komga keys accounts
# by email claim, so display identity is unaffected.
apiVersion: v1
kind: ConfigMap
metadata:
  name: komga-app-config
  namespace: manga
data:
  application.yml: |
    komga:
      # Auto-create a (non-admin) Komga account on first SSO login — requires
      # email_verified=true, which the blueprint's custom email scope pins.
      oauth2-account-creation: true
    server:
      # Behind the cilium gateway: trust X-Forwarded-* so {baseUrl} in the
      # redirect-uri template resolves to https://komga.seyzahl.com.
      forward-headers-strategy: framework
    spring:
      security:
        oauth2:
          client:
            registration:
              authentik:
                provider: authentik
                client-id: komga-manga-sso
                client-secret: ${KOMGA_OIDC_CLIENT_SECRET}
                client-name: authentik
                scope: openid,email,profile
                authorization-grant-type: authorization_code
                redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            provider:
              authentik:
                user-name-attribute: sub
                issuer-uri: https://auth.seyzahl.com/application/o/komga/
