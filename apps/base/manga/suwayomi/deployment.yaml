apiVersion: apps/v1
kind: Deployment
metadata:
  name: suwayomi
  namespace: manga
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: suwayomi
  template:
    metadata:
      labels:
        app: suwayomi
        policy-type: app
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: suwayomi
          # Renovate-tracked; latest release verified against ghcr pre-commit.
          image: ghcr.io/suwayomi/tachidesk:v2.3.2238
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: TZ
              value: "America/Los_Angeles"
            - name: BIND_IP
              value: "0.0.0.0"
            - name: BIND_PORT
              value: "4567"
            # Pin the WebUI to the build bundled inside the server image (PR
            # #120 lesson: channel=stable auto-updated the WebUI past the
            # server and blanked the source list). The provisioner also sets
            # webUIChannel=BUNDLED via GraphQL; the env pin covers the window
            # before the provisioner has run. All functional settings
            # (downloads, updates, repos) are provisioner-set via GraphQL —
            # env-var config is unreliable for Suwayomi and not used for them.
            - name: WEB_UI_CHANNEL
              value: "bundled"
            - name: WEB_UI_UPDATE_INTERVAL
              value: "0"
          ports:
            - containerPort: 4567
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 4567
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4567
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            # Library updates are CPU-spiky (parallel source fetches) — cap so
            # a bulk update can't starve the node.
            limits:
              memory: "2Gi"
              cpu: "2"
          volumeMounts:
            - name: suwayomi-config
              mountPath: /home/suwayomi/.local/share/Tachidesk
            # Shared library (RW) — provisioner sets downloadsPath=/library so
            # CBZ + ComicInfo.xml land where Komga scans.
            - name: manga-library
              mountPath: /library
              subPath: manga-v2
      volumes:
        - name: suwayomi-config
          persistentVolumeClaim:
            claimName: suwayomi-config
        - name: manga-library
          persistentVolumeClaim:
            claimName: manga-library
