# Idempotent provisioning Job — wires the whole manga stack via app APIs so a
# rebuild comes up configured with zero clicks (media-provisioner pattern):
# Komga claim/admin + komf service user + API key + library, Suwayomi GraphQL
# settings + Keiyoushi store + pinned non-NSFW extensions, generated-credential
# Secret (PushSecret mirrors to Key Vault), Komf initial metadata match.
#
# The script is a configMapGenerator (manga-provision-script); its hash suffix
# changes when provision.ts changes, and the force annotation lets Flux replace
# the immutable Job so it reruns automatically. Manual rerun:
#   kubectl -n manga delete job manga-provisioner && flux reconcile ks apps
apiVersion: batch/v1
kind: Job
metadata:
  name: manga-provisioner
  namespace: manga
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: manga-provisioner
        policy-type: app
    spec:
      restartPolicy: OnFailure
      serviceAccountName: manga-provisioner
      containers:
        - name: provision
          image: oven/bun:1.2-alpine
          command: ["bun", "run", "/app/provision.ts"]
          env:
            - name: KOMGA_BASE
              value: http://komga:25600
            - name: SUWAYOMI_BASE
              value: http://suwayomi:4567
            - name: KOMF_BASE
              value: http://komf:8085
            - name: KOMGA_ADMIN_EMAIL
              value: admin@seyzahl.com
            - name: KOMGA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: komga-admin-credentials
                  key: KOMGA_ADMIN_PASSWORD
            - name: KOMF_USER_EMAIL
              value: komf@seyzahl.com
            - name: GEN_SECRET_NAME
              value: manga-generated-credentials
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Trust the cluster CA so the script can call the kube API with
            # plain fetch (Bun honors NODE_EXTRA_CA_CERTS).
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: script
          configMap:
            name: manga-provision-script
