# All manga secrets flow Key Vault (seyzahl) <-> ESO <-> K8s Secrets.
#
# Seed (staged once from the workstation by scripts/manga/stage-secrets.ts):
#   manga-komga-admin-password  ->  komga-admin-credentials Secret (below)
#
# Runtime (minted by the manga-provisioner Job via app APIs, written to the
# manga-generated-credentials Secret through the kube API):
#   komfPassword  — dedicated komf@ Komga service user's password
#   komgaApiKey   — Komga API key (comment "ops-bootstrap") for ops/verification
# The PushSecret below mirrors both INTO Key Vault so nothing lives only in
# the cluster; Komf consumes manga-generated-credentials directly (no circular
# ESO wait on first bring-up).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komga-admin-credentials
  namespace: manga
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: komga-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: KOMGA_ADMIN_PASSWORD
      remoteRef:
        key: manga-komga-admin-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: manga-generated-credentials
  namespace: manga
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: azure-kv-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: manga-generated-credentials
  updatePolicy: Replace
  deletionPolicy: None
  data:
    - match:
        secretKey: komfPassword
        remoteRef:
          remoteKey: manga-komf-komga-password
    - match:
        secretKey: komgaApiKey
        remoteRef:
          remoteKey: manga-komga-api-key
