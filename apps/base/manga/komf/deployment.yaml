apiVersion: apps/v1
kind: Deployment
metadata:
  name: komf
  namespace: manga
  annotations:
    # application.yml is a subPath mount (updates don't propagate in-place) —
    # reloader restarts the pod when komf-config changes.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: komf
  template:
    metadata:
      labels:
        app: komf
        policy-type: app
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: komf
          # Renovate-tracked; latest release verified against Docker Hub
          # pre-commit (no ghcr mirror published for komf).
          image: docker.io/sndxr/komf:1.7.1
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: KOMF_KOMGA_BASE_URI
              value: http://komga:25600
            # Dedicated Komga service user, created by the manga-provisioner
            # Job via the Komga API (komf 1.7.1 authenticates to Komga with
            # user/password only — apiKey auth exists only for Kavita). The
            # password is minted at bootstrap and mirrored to Key Vault via
            # PushSecret (manga-komf-komga-password).
            - name: KOMF_KOMGA_USER
              value: komf@seyzahl.com
            - name: KOMF_KOMGA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manga-generated-credentials
                  key: komfPassword
          ports:
            - containerPort: 8085
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: komf-data
              mountPath: /config
            - name: komf-config
              mountPath: /config/application.yml
              subPath: application.yml
      volumes:
        - name: komf-data
          persistentVolumeClaim:
            claimName: komf-data
        - name: komf-config
          configMap:
            name: komf-config
