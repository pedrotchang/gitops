# local-path (node SSD), NOT truenas-nfs: komf's /config/database.sqlite has
# the same SQLite-on-nolock-NFS corruption exposure Komga rejects outright
# (jellyfin-config precedent). Losable data — it's only match-state cache.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: komf-data
  namespace: manga
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
