# Defense-in-depth network policy for the manga namespace (Cilium idiom per
# apps/base/home/network-policy.yaml and apps/base/media/network-policy.yaml).
#
# All workloads (suwayomi, komga, komf, provisioner Job) carry policy-type: app.
# Ingress: cluster + gateway. Egress: DNS, in-cluster (komf<->komga, provisioner
# ->all three, provisioner->kube-apiserver for the generated-credentials Secret),
# and web 443/80 (Suwayomi source fetching + Keiyoushi APKs, Komf metadata
# providers). Komga itself needs no world egress but shares the label — kept
# uniform for simplicity, matching the home namespace precedent.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: manga-apps
  namespace: manga
spec:
  endpointSelector:
    matchLabels:
      policy-type: app
  ingress:
    - fromEntities:
        - cluster
    - fromEntities:
        - ingress
  egress:
    # Cluster DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # In-cluster traffic (komf -> komga API, provisioner -> app APIs)
    - toEndpoints:
        - {}
    # Kube API (provisioner writes the manga-generated-credentials Secret)
    - toEntities:
        - kube-apiserver
    # Web egress: manga sources, extension APKs, metadata providers.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
        - ports:
            - port: "80"
              protocol: TCP
