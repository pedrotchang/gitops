# Bun web app. Non-root + read-only root fs; Bun's runtime caches go to /tmp.
# Postgres lives on the data cluster (databases/data/brick-building), reached
# through its LoadBalancer hostname; PG* env vars are read natively by Bun.sql.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brick-building
  labels:
    app: brick-building
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brick-building
  template:
    metadata:
      labels:
        app: brick-building
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: brick-building
          # Published by pedrotchang/brick-building CI via platform-infrastructure/actions build-and-push.
          image: forgejo.seyzahl.com/platform-infrastructure/brick-building:34f95fbb3cd814d1070a44bfb21c6c8b7d51df00@sha256:05f4fc54d47f1435fe49ec8e5a6ed35361c6262b8ca091d76b544891e90548b0
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: brick-building-pg.seyzahl.com
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: brick_building
          envFrom:
            - secretRef:
                name: brick-building-db-creds
            - secretRef:
                name: brick-building-app-secrets
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
