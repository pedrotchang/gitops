# Same Key Vault entries the data-cluster CNPG Cluster bootstraps its owner from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brick-building-db-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: brick-building-db-creds
  data:
    - secretKey: PGUSER
      remoteRef:
        key: brick-building-db-username
    - secretKey: PGPASSWORD
      remoteRef:
        key: brick-building-db-password
---
# App secrets: the at-rest encryption key for per-user API keys stored in
# Postgres, and the instance-wide market data API key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brick-building-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: brick-building-app-secrets
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef:
        key: brick-building-encryption-key
    - secretKey: MASSIVE_API_KEY
      remoteRef:
        key: brick-building-massive-api-key
    - secretKey: ALPACA_API_KEY_ID
      remoteRef:
        key: brick-building-alpaca-key-id
    - secretKey: ALPACA_API_SECRET_KEY
      remoteRef:
        key: brick-building-alpaca-secret
    - secretKey: SEC_USER_AGENT
      remoteRef:
        key: brick-building-sec-user-agent
