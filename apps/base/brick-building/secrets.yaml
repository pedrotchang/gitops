# Same Key Vault entries the data-cluster CNPG Cluster bootstraps its owner from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brick-building-db-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: brick-building-db-creds
  data:
    - secretKey: PGUSER
      remoteRef:
        key: brick-building-db-username
    - secretKey: PGPASSWORD
      remoteRef:
        key: brick-building-db-password
