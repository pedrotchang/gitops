apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulsewatch
  namespace: pulsewatch
spec:
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: pulsewatch
  data:
    - secretKey: PULSEWATCH_ADMIN_PASSWORD
      remoteRef:
        key: pulsewatch-admin-password
    - secretKey: PULSEWATCH_PUSH_KEY
      remoteRef:
        key: pulsewatch-push-key
