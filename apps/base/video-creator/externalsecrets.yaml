apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: video-creator-ai-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: video-creator-anthropic-api-key
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: video-creator-gemini-api-key
    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: video-creator-elevenlabs-api-key
    - secretKey: ELEVENLABS_VOICE_ID
      remoteRef:
        key: video-creator-elevenlabs-voice-id
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: video-creator-integration-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: video-creator-immich-api-key
    - secretKey: FORGEJO_TOKEN
      remoteRef:
        key: video-creator-forgejo-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: video-creator-youtube-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: YOUTUBE_CLIENT_ID
      remoteRef:
        key: video-creator-youtube-client-id
    - secretKey: YOUTUBE_CLIENT_SECRET
      remoteRef:
        key: video-creator-youtube-client-secret
    - secretKey: YOUTUBE_REFRESH_TOKEN
      remoteRef:
        key: video-creator-youtube-refresh-token
