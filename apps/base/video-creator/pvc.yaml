apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: video-creator-projects
  labels:
    app.kubernetes.io/name: video-creator
    app.kubernetes.io/component: project-storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 100Gi
