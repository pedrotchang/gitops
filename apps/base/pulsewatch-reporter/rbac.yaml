apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsewatch-reporter
  namespace: pulsewatch
---
# Read-only: the reporter lists backups, Flux objects and nodes, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulsewatch-reporter
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["list"]
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulsewatch-reporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulsewatch-reporter
subjects:
  - kind: ServiceAccount
    name: pulsewatch-reporter
    namespace: pulsewatch
