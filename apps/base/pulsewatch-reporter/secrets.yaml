apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulsewatch-reporter
  namespace: pulsewatch
spec:
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: pulsewatch-reporter
  data:
    - secretKey: PULSEWATCH_PUSH_KEY
      remoteRef:
        key: pulsewatch-push-key
