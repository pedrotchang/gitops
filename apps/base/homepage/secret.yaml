apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    kubernetes.io/service-account.name: homepage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-weather
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: homepage-weather
  data:
    - secretKey: OPENWEATHER_API_KEY
      remoteRef:
        key: openweathermap-api-key
---
# Widget credentials for service tiles. Mirrors the same KV entries the media
# namespace consumes (apps/base/media/secrets.yaml) — nothing minted for
# homepage; injected via envFrom prefix HOMEPAGE_VAR_ in the deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-widgets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: homepage-widgets
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: media-sonarr-api-key
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: media-radarr-api-key
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: media-prowlarr-api-key
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: media-bazarr-api-key
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: media-jellyfin-api-key
    - secretKey: JELLYSEERR_API_KEY
      remoteRef:
        key: media-jellyseerr-api-key
