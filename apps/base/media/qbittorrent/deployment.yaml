# The ONLY multi-container pod in the stack: qBittorrent shares gluetun's
# network namespace so it has no internet route of its own.
#
# Isolation layers (each independently sufficient, per the rebuild design):
#   1. gluetun kill-switch firewall (FIREWALL=on default) — VPN drop blocks egress
#   2. qBittorrent bound to tun0 (configmap-init) — sockets die if tunnel vanishes
#   3. CiliumNetworkPolicy media-vpn-pod — node-level: only UDP 51820 + DNS may leave
#   4. vpn-leak-canary CronJob — confinement failures page instead of hiding
#
# gluetun runs as a NATIVE SIDECAR (initContainer + restartPolicy: Always) so its
# readiness gates qBittorrent's start — tun0 provably exists before libtorrent
# tries to bind it (qBittorrent 5.x errors on a missing bound interface).
#
# Deliberately absent vs the old design:
#   - DNS_KEEP_NAMESERVER=on   (DNS leaked outside the tunnel; DoT-in-tunnel is default)
#   - SERVER_HOSTNAMES pin     (stale server lists took the tunnel down)
#   - FIREWALL_OUTBOUND_SUBNETS (only Prowlarr-in-pod needed it; conntrack covers replies)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        policy-type: vpn
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # Route the whole pod's DNS at gluetun's in-netns resolver (127.0.0.1:53,
      # DoT through the tunnel). Without this, qBittorrent keeps the kubelet
      # kube-dns resolv.conf and its tracker/peer hostname lookups leak to the
      # WAN resolver outside the VPN — torrent traffic rides tun0, but the DNS
      # metadata (which trackers you use) would not. Fail-closed: if gluetun's
      # resolver is down, resolution fails rather than leaking.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1
          restartPolicy: Always
          # Stale ip rules from a previous gluetun instance persist in the pod
          # netns across container restarts and block reconnection with
          # "adding IPv6 rule: file exists" (gluetun#2521; documented k8s fix).
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "nordvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-vpn-credentials
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: gluetun-vpn-credentials
                  key: WIREGUARD_ADDRESSES
            - name: SERVER_COUNTRIES
              value: "United States"
            - name: SERVER_CITIES
              value: "Los Angeles"
            - name: TZ
              value: "America/Los_Angeles"
            - name: UPDATER_PERIOD
              value: "24h"
            # DNS-over-TLS through the tunnel, but WITHOUT the ad/malware
            # blocklists — building them in memory OOM-killed gluetun at 512Mi
            # before it went healthy (crashloop). We only need name resolution.
            - name: DOT_BLOCK_MALICIOUS
              value: "off"
            - name: DOT_BLOCK_ADS
              value: "off"
            - name: DOT_BLOCK_SURVEILLANCE
              value: "off"
            # Health + control servers must bind all interfaces so kubelet
            # probes and the leak canary (via Service) can reach them.
            - name: HEALTH_SERVER_ADDRESS
              value: ":9999"
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: ":8000"
            # WebUI (arr apps/outpost), control server (canary), and the health
            # server — all three are probed via the pod IP, so gluetun's kill
            # switch must allow them inbound. 9999 was the missing one: the
            # kubelet readiness probe hits the pod IP and the firewall dropped
            # it (localhost bypassed the firewall, masking the problem).
            - name: FIREWALL_INPUT_PORTS
              value: "8080,8000,9999"
          ports:
            - containerPort: 8000
              name: control
            - containerPort: 9999
              name: health
          volumeMounts:
            - name: gluetun-config
              mountPath: /gluetun
            - name: tun-device
              mountPath: /dev/net/tun
          # For a native sidecar, the main container waits on the sidecar's
          # STARTUP probe (not readiness). The health server returns 200 only
          # once the tunnel is up, so this actually gates qBittorrent's start
          # on tun0 existing — otherwise qbit would boot before WireGuard and
          # rely on libtorrent auto-rebinding.
          startupProbe:
            httpGet:
              path: /
              port: 9999
            periodSeconds: 3
            failureThreshold: 40
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.2_v2.0.13-ls464
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Los_Angeles"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: webui
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: media-data
              mountPath: /data
            - name: qbittorrent-init
              mountPath: /custom-cont-init.d/99-configure-interface.sh
              subPath: 99-configure-interface.sh
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: gluetun-config
          persistentVolumeClaim:
            claimName: gluetun-config
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
        - name: qbittorrent-init
          configMap:
            name: qbittorrent-init
            defaultMode: 0755
