apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "qBittorrent"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "qbittorrent.png"
    gethomepage.dev/href: "https://qbittorrent.seyzahl.com"
spec:
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      protocol: TCP
    # gluetun control server — used by the vpn-leak-canary only
    - name: gluetun-control
      port: 8000
      targetPort: 8000
      protocol: TCP
