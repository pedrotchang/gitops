# Defense-in-depth network policy for the media namespace (Cilium idiom per
# apps/base/forgejo/network-policy.yaml).
#
# policy-type: app — cluster ingress, DNS + in-cluster + web egress.
# (The VPN-confined qbittorrent tier was removed with qbittorrent.)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-apps
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      policy-type: app
  ingress:
    - fromEntities:
        - cluster
    - fromEntities:
        - ingress
  egress:
    # Cluster DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # In-cluster traffic (authentik, inter-arr sync)
    - toEndpoints:
        - {}
    # Indexers, metadata providers, subtitle providers
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
        - ports:
            - port: "80"
              protocol: TCP