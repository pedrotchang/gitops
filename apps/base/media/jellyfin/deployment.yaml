apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        policy-type: app
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Seeds the SSO plugin + reverse-proxy trust into the config PVC before
        # Jellyfin starts. Plugins live on the PVC (not the image), so this
        # carrier-image copy is what makes authentik OIDC work from first boot
        # with zero click-ops; the media-provisioner then configures the plugin
        # via API. Copy-if-absent → idempotent across restarts; a plugin bump
        # ships a new versioned dir, which Jellyfin prefers automatically.
        - name: seed-sso
          image: forgejo.seyzahl.com/platform-infrastructure/jellyfin-sso-plugin:4.0.0.4@sha256:22484de10fbd8ccb3c09da36483660c25b3a6e7c53038710cbf152fb6bcd99e6
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /config/plugins /config/config
              for d in /plugin/*/; do
                name=$(basename "$d")
                if [ -d "/config/plugins/$name" ]; then
                  echo "plugin $name: already present"
                else
                  cp -r "$d" "/config/plugins/$name"
                  echo "plugin $name: seeded"
                fi
              done
              if [ -f /config/config/network.xml ]; then
                echo "network.xml: already present"
              else
                printf '%s\n' \
                  '<?xml version="1.0" encoding="utf-8"?>' \
                  '<NetworkConfiguration>' \
                  '  <KnownProxies>' \
                  '    <string>10.244.0.0/16</string>' \
                  '    <string>192.168.7.0/24</string>' \
                  '  </KnownProxies>' \
                  '</NetworkConfiguration>' \
                  > /config/config/network.xml
                echo "network.xml: seeded (KnownProxies for the gateway hops)"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jellyfin.seyzahl.com"
            - name: TZ
              value: "America/Los_Angeles"
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-data
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data
