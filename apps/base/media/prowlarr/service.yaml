apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "prowlarr"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "prowlarr.png"
    gethomepage.dev/href: "https://prowlarr.seyzahl.com"
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: 9696
      protocol: TCP
