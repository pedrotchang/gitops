# All media secrets flow Key Vault (seyzahl) → ESO → K8s Secrets.
# Staging of the KV entries themselves: scripts/media/stage-secrets.ts (workstation, az).
---
# NordVPN WireGuard credentials for the gluetun sidecar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-vpn-credentials
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: gluetun-vpn-credentials
    creationPolicy: Owner
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: gluetun-wireguard-private-key
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: wireguard-address
---
# App API keys — generated once by stage-secrets.ts, held in KV, injected as env
# so the running apps always match what the provisioner and inter-app wiring use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-app-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: media-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: media-sonarr-api-key
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: media-radarr-api-key
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: media-prowlarr-api-key
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: media-bazarr-api-key
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: media-jellyfin-api-key
    - secretKey: JELLYSEERR_API_KEY
      remoteRef:
        key: media-jellyseerr-api-key
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: media-qbittorrent-password
    - secretKey: JELLYFIN_ADMIN_PASSWORD
      remoteRef:
        key: media-jellyfin-admin-password
    - secretKey: JELLYFIN_OIDC_CLIENT_SECRET
      remoteRef:
        key: jellyfin-oidc-client-secret
---
# Authentik proxy-outpost token (one embedded outpost serves all *arr + qbit apps).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-outpost-token
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: media-outpost-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: media-outpost-token
