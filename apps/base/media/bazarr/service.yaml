apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "bazarr"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "bazarr.png"
    gethomepage.dev/href: "https://bazarr.seyzahl.com"
spec:
  selector:
    app: bazarr
  ports:
    - name: http
      port: 6767
      targetPort: 6767
      protocol: TCP
