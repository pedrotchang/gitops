# Pulls Hermes' API keys from Azure Key Vault via External Secrets Operator.
# Materializes the Secret that the HelmRelease references as secrets.existingSecret.
# - OPENROUTER_API_KEY: KV secret "openrouter-api-key" (already staged)
# - TELEGRAM_BOT_TOKEN: KV secret "hermes-telegram-bot-token"
# - LITELLM_MASTER_KEY / API_SERVER_KEY: LLM proxy bearer / Hermes API bearer
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-secrets
  namespace: hermes-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: hermes-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: anthropic-hermes-api-key
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter-api-key
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: hermes-telegram-bot-token
    - secretKey: EMAIL_PASSWORD
      remoteRef:
        key: google-hermes-app
    # Nextcloud CalDAV (Phase 1 calendar). App-password + its login, both from KV —
    # NOT Pedro's OIDC userid (the basic-auth login is the app-password's own username).
    # These surface as pod env via the chart's envFrom and are referenced by the
    # caldav MCP as ${CALDAV_USERNAME}/${CALDAV_PASSWORD}.
    - secretKey: CALDAV_USERNAME
      remoteRef:
        key: nextcloud-hermes-user
    - secretKey: CALDAV_PASSWORD
      remoteRef:
        key: nextcloud-hermes-pass
    # Bearer key for the in-cluster Whisper (Speaches API_KEY). Same KV secret the
    # whisper ns consumes; Hermes sends it as the OpenAI-client key for STT.
    - secretKey: VOICE_TOOLS_OPENAI_KEY
      remoteRef:
        key: whisper-api-key
    # Bearer for the LiteLLM proxy (all LLM calls); same KV value LiteLLM holds.
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm-master-key
    # Bearer clients (Open WebUI) present to Hermes' own OpenAI-compatible API.
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes-api-server-key
