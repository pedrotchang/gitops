apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  interval: 30m
  chart:
    spec:
      chart: ./
      sourceRef:
        kind: GitRepository
        name: hermes-agent
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      # Chart default 0.8.0 isn't published on Docker Hub; real tags are CalVer.
      # Pinned to the newest multi-arch (amd64) tag as of 2026-06-21.
      # TODO: fix the chart's default image.tag + appVersion upstream.
      tag: "v2026.6.19"
    replicaCount: 1
    strategy:
      type: Recreate

    # Phase 0: chat gateway only (you DM the bot). API server + ingress arrive in
    # later phases (n8n). Gateway is outbound-only, so no Service/ingress here.
    args:
      - gateway
      - run

    # LLM: OpenRouter, Claude Haiku as the cheap default.
    # Slug verified against the OpenRouter catalog 2026-06-21 (latest Haiku = 4.6).
    config:
      values:
        model:
          default: anthropic/claude-haiku-4.6
          provider: auto
          base_url: https://openrouter.ai/api/v1

    env:
      GATEWAY_ALLOW_ALL_USERS: "false"
      # Comma-separated numeric Telegram user IDs (family allowlist).
      # Pedro: 6403864751. Append Hanna's ID (comma-separated) when available.
      TELEGRAM_ALLOWED_USERS: "6403864751"
      # Tell s6-overlay the root fs is read-only so it keeps all scratch under /run,
      # which lets the agent stay non-root + readOnlyRootFilesystem.
      S6_READ_ONLY_ROOT: "1"

    # Secrets come from the ExternalSecret (Azure Key Vault via ESO).
    secrets:
      existingSecret: hermes-agent-secrets

    # Single replica + durable block storage for HERMES_HOME (the agent's memory).
    # iSCSI is RWO, which is correct here — the chart forbids replicas>1 with persistence.
    persistence:
      enabled: true
      storageClass: truenas-iscsi
      accessMode: ReadWriteOnce
      size: 5Gi

    # s6-overlay (the image's init) needs a writable /run owned by the run-as user.
    # NO container runs as root. We keep the chart's full hardening (non-root uid 1000,
    # read-only root fs, RuntimeDefault seccomp) and only give s6 a /run emptyDir plus
    # the three narrow file-ownership caps it needs to prepare /run itself as uid 1000.
    # Works together with S6_READ_ONLY_ROOT=1 set in env above.
    extraVolumes:
      - name: run
        emptyDir: {}
    extraVolumeMounts:
      - name: run
        mountPath: /run
    securityContext:
      readOnlyRootFilesystem: true
      # Must be true so the added CHOWN cap is actually EFFECTIVE for the non-root
      # (uid 1000) process: no_new_privs (set by =false) strips added caps on exec,
      # which is why s6 couldn't chown /run. The agent still runs as uid 1000 and can
      # never become root — its capability ceiling is just the 3 file caps below.
      allowPrivilegeEscalation: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
