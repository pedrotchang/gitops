apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  interval: 30m
  chart:
    spec:
      chart: ./
      sourceRef:
        kind: GitRepository
        name: hermes-agent
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      # Chart default 0.8.0 isn't published on Docker Hub; real tags are CalVer.
      # Pinned to the newest multi-arch (amd64) tag as of 2026-06-21.
      # TODO: fix the chart's default image.tag + appVersion upstream.
      tag: "v2026.6.19"
    replicaCount: 1
    strategy:
      type: Recreate

    # Phase 0: chat gateway only (you DM the bot). API server + ingress arrive in
    # later phases (n8n). Gateway is outbound-only, so no Service/ingress here.
    args:
      - gateway
      - run

    # LLM: direct Anthropic API, Claude Sonnet 4.6 (agentic sweet spot, prompt caching).
    # Direct model IDs differ from OpenRouter's — verified via Anthropic /v1/models
    # (2026-06-22): claude-sonnet-4-6. Uses ANTHROPIC_API_KEY (ESO ← anthropic-hermes-api-key);
    # no base_url so it hits Anthropic's default endpoint.
    config:
      values:
        model:
          default: claude-sonnet-4-6
          provider: anthropic
          # Route through the Headroom compression proxy (own `headroom` namespace),
          # which forwards to Anthropic and passes ANTHROPIC_API_KEY through. Verified
          # in-cluster: Hermes → headroom svc → Anthropic returns valid responses.
          # To bypass Headroom, set this back to https://api.anthropic.com.
          base_url: "http://headroom.headroom.svc.cluster.local:8787"
        # Speech-to-text for Telegram voice memos → self-hosted Whisper (own `whisper` ns).
        # provider=openai points at the in-cluster Speaches service (STT_OPENAI_* env below).
        stt:
          enabled: true
          provider: openai
          # The image ships a default `openai.model: whisper-1` in config.yaml.
          # Hermes resolves the STT model as: call-arg → stt.openai.model →
          # STT_OPENAI_MODEL env. The config key WINS over the env, so without this
          # override Hermes sends "whisper-1", which Speaches aliases to its built-in
          # default `Systran/faster-whisper-large-v3` (not baked, HF offline) → 404.
          # Pin the baked model name here so the request matches what Speaches has.
          openai:
            model: Systran/faster-whisper-small
        # Phase 1 calendar — CalDAV via the `caldav-mcp` npm package as a STDIO MCP
        # server (the image ships npx + the pod has egress; `-y` auto-installs
        # non-interactively, fetched at runtime → NOT offline-baked, revisit later).
        # Tools: list-calendars, list/create/update/delete-event. The agent finds the
        # shared "Family" calendar URL via list-calendars. Creds come from the ESO
        # secret via ${VAR} expansion (Hermes expands ${ENV} in config values), so
        # nothing secret lands in git. CALDAV_USERNAME/PASSWORD are the app-password's
        # own login (NOT Pedro's OIDC userid); base_url is the public DAV root
        # (no authentik forward-auth on the nextcloud ingress).
        mcp_servers:
          caldav:
            command: npx
            args:
              - "-y"
              - caldav-mcp
            env:
              CALDAV_BASE_URL: "https://nextcloud.seyzahl.com/remote.php/dav"
              CALDAV_USERNAME: "${CALDAV_USERNAME}"
              CALDAV_PASSWORD: "${CALDAV_PASSWORD}"

    env:
      GATEWAY_ALLOW_ALL_USERS: "false"
      # Comma-separated numeric Telegram user IDs (family allowlist).
      # Pedro: 6403864751. Append Hanna's ID (comma-separated) when available.
      TELEGRAM_ALLOWED_USERS: "6403864751"
      # Email gateway — dedicated inbox the agent monitors (IMAP login verified).
      # EMAIL_PASSWORD is injected from the ExternalSecret (KV google-hermes-app).
      EMAIL_ADDRESS: "pedrotychang.hermes@gmail.com"
      EMAIL_IMAP_HOST: "imap.gmail.com"
      EMAIL_IMAP_PORT: "993"
      EMAIL_SMTP_HOST: "smtp.gmail.com"
      EMAIL_SMTP_PORT: "587"
      # Speech-to-text backend → self-hosted Whisper (Speaches) in the `whisper` ns.
      # provider=openai (set in config.stt) + this base_url route STT to the in-cluster
      # service; the key is a dummy (Speaches has no auth).
      STT_OPENAI_BASE_URL: "http://whisper.whisper.svc.cluster.local:8000/v1"
      # Fallback model default only — the actual model is pinned via config.stt.openai.model
      # above, which shadows this env. Kept in sync so both agree on the baked model.
      STT_OPENAI_MODEL: "Systran/faster-whisper-small"
      VOICE_TOOLS_OPENAI_KEY: "sk-not-needed-self-hosted"
      # Only process mail FROM these senders — forward flights/events from these accounts.
      EMAIL_ALLOWED_USERS: "pedrotychang@gmail.com,hanna.jeon12@gmail.com"

    # Secrets come from the ExternalSecret (Azure Key Vault via ESO).
    secrets:
      existingSecret: hermes-agent-secrets

    # Single replica + durable block storage for HERMES_HOME (the agent's memory).
    # iSCSI is RWO, which is correct here — the chart forbids replicas>1 with persistence.
    persistence:
      enabled: true
      storageClass: truenas-iscsi
      accessMode: ReadWriteOnce
      size: 5Gi

    # Run as the image intends. The container starts as root so the s6 init can set up
    # /run and then DROP the actual agent to the non-root "hermes" user (uid 10000) via
    # s6-setuidgid — see the image's main-wrapper.sh, which explicitly refuses arbitrary
    # --user values (that's what broke our earlier runAsUser:1000 attempts). So the
    # code-executing agent runs NON-ROOT; only PID 1 (the s6 supervisor) is root, the
    # same pattern the official nginx/postgres images use. fsGroup 10000 matches the
    # hermes gid so the dropped agent can write HERMES_HOME on the PVC.
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 10000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: true
      # Talos applies a restricted default capability set, so even the root s6 init
      # can't chown HERMES_HOME or drop privileges to hermes (uid 10000) — chown() and
      # setgroups() return EPERM. Grant only the caps a privilege-dropping init needs.
      # The agent still ends up running as NON-ROOT uid 10000; these caps live on the
      # s6 supervisor (PID 1) only, which uses them to set up and then drop privileges.
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - FSETID
          - SETUID
          - SETGID
          - SETPCAP
          - KILL
      seccompProfile:
        type: RuntimeDefault
