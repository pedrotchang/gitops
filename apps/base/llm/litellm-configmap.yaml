# LiteLLM proxy config — the single OpenAI-compatible front door for every
# model call on the cluster. Clients (Open WebUI, LobeHub, Hermes) pick by name:
#   local         → Ollama Qwen3-4B-Instruct on the Aorus GPU (fast, free, simple tasks)
#   claude-sonnet → Anthropic Claude Sonnet via the headroom compression proxy
#   claude-opus   → Anthropic Claude Opus via headroom (rare, expensive)
#   hermes        → the Hermes agent's own API server (tools: calendar, mail, …)
#   whisper       → in-cluster Speaches (speech-to-text, /audio/transcriptions)
#   embedding     → Qwen3-Embedding-0.6B on Ollama, CPU-only (1024-dim vectors
#                   for LobeHub's knowledge base and memory)
# Chat UIs allowlist the chat names; whisper/embedding are for app plumbing.
# Model IDs verified against Anthropic /v1/models on 2026-11-12.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: local
        litellm_params:
          # The Instruct-2507 build, NOT `qwen3:4b`: that tag is the
          # Thinking-2507 build, which always reasons and (verified 2026-11-12)
          # dumps the reasoning into `content` even with think=false.
          model: ollama_chat/qwen3:4b-instruct-2507-q4_K_M
          api_base: http://ollama.llm.svc.cluster.local:11434
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_base: http://headroom.headroom.svc.cluster.local:8787
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-opus
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_base: http://headroom.headroom.svc.cluster.local:8787
          api_key: os.environ/ANTHROPIC_API_KEY
      # Hermes is itself an agent (it calls back into LiteLLM for claude-sonnet);
      # this entry just lets every chat UI reach it through one front door.
      - model_name: hermes
        litellm_params:
          model: openai/hermes
          api_base: http://hermes-agent.hermes-agent.svc.cluster.local:8642/v1
          api_key: os.environ/HERMES_API_SERVER_KEY
      - model_name: whisper
        litellm_params:
          model: openai/deepdml/faster-whisper-large-v3-turbo-ct2
          api_base: http://whisper.whisper.svc.cluster.local:8000/v1
          # Speaches runs keyless (the whisper CNP is the gate); the OpenAI
          # client still needs a non-empty key.
          api_key: unused
        model_info:
          mode: audio_transcription
      - model_name: embedding
        litellm_params:
          # `lobe-embed` = qwen3-embedding:0.6b with num_ctx 8192 and num_gpu 0,
          # built by the ollama-seed Job: CPU-only so it never competes with
          # whisper and the chat model for the 8 GB of VRAM.
          model: ollama/lobe-embed
          api_base: http://ollama.llm.svc.cluster.local:11434
        model_info:
          mode: embedding

    litellm_settings:
      # Clients send provider-specific params freely; drop what a backend
      # cannot take instead of erroring.
      drop_params: true
      request_timeout: 600
      telemetry: false

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
