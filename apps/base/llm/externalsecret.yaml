# LiteLLM secrets from Azure Key Vault via External Secrets Operator.
# - LITELLM_MASTER_KEY: KV "litellm-master-key" — bearer every client (Open WebUI,
#   LobeHub, Hermes) must present. Callers get the same value from their own
#   ExternalSecret.
# - ANTHROPIC_API_KEY: KV "anthropic-hermes-api-key" — forwarded through headroom
#   to Anthropic for the claude-* models (same key Hermes uses today).
# - HERMES_API_SERVER_KEY: KV "hermes-api-server-key" — bearer for the Hermes
#   API server behind the `hermes` model.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm-master-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: anthropic-hermes-api-key
    - secretKey: HERMES_API_SERVER_KEY
      remoteRef:
        key: hermes-api-server-key
