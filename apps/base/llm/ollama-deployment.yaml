# Ollama — the local model runtime (Qwen3-4B-Instruct) on the Aorus RTX 5060, shared
# with whisper / Immich ML / Jellyfin via GPU time-slicing. Only LiteLLM talks
# to it; Open WebUI and Hermes go through LiteLLM. Models live on the
# ollama-models PVC and are fetched by the ollama-seed Job (this pod has no
# egress at all, so it can never download anything itself).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  # One GPU slice + RWO volume: stop the old pod before starting the new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia
      priorityClassName: gpu-workload
      nodeSelector:
        nvidia.com/gpu.present: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          # Upstream image pinned by digest; registered in custom-images for the
          # mirror gate — flip to forgejo.seyzahl.com/platform-infrastructure/ollama
          # once it promotes.
          image: docker.io/ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: /models
            - name: HOME
              value: /models
            # Unload after 15 idle minutes. Holding it forever (was "-1") starved
            # whisper: a 47-min transcription peaks at ~2.4 GB and OOMed next to a
            # permanently loaded model (2026-11-12). Reload from the PVC is a few
            # seconds, paid only on the first message after a quiet spell.
            - name: OLLAMA_KEEP_ALIVE
              value: "15m"
            # One model at a time on an 8 GB card shared with whisper and Immich.
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            # 32k so a one-hour transcript (~22k tokens with Open WebUI's file
            # wrapper; a 47-min one was 17.6k and overflowed 16k) fits with room
            # to answer. q4_0 KV cache keeps 32k at ~1.2 GB, the same VRAM as 16k
            # at q8 → ~3.7 GB loaded, which fits beside whisper (~2.4 GB peak) and
            # Immich ML on the 8 GB card. Trade-off: slightly less precise recall
            # deep in long contexts. 32k at q8 (~5.2 GB) OOMed whisper.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
            # Quantized KV cache requires flash attention.
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q4_0
          startupProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 8Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        - name: tmp
          emptyDir: {}
