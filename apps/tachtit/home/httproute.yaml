apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home
  # INTERNAL ONLY (immich-local pattern). exclude:true keeps the host OUT of
  # public DNS; it resolves internally via the *.seyzahl.com wildcard to the
  # private gateway (Headscale/LAN only). No cloudflared tunnel = never public.
  # A baby camera must never be reachable from the WAN.
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - ha.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: home-assistant
          port: 8123
