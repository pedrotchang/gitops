apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home
  # INTERNAL ONLY. The .local.seyzahl.com host is published to internal DNS and
  # served straight off the cilium-gateway — no cloudflared tunnel, no public
  # exposure. A baby camera must never be reachable from the WAN.
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ha.local.seyzahl.com
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - ha.local.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: home-assistant
          port: 8123
