# Internal ClusterIP services for inter-app communication on native ports
# (LoadBalancer services above only expose port 80)
apiVersion: v1
kind: Service
metadata:
  name: sonarr-internal
  namespace: gluetun
spec:
  selector:
    app: sonarr
  ports:
    - port: 8989
      targetPort: 8989
---
