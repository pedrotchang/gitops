apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  labels:
    cilium-lb-pool: apps-pool
  annotations:
    external-dns.alpha.kubernetes.io/hostname: qbittorrent.seyzahl.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "qBittorrent"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "qbittorrent.png"
    gethomepage.dev/href: "http://qbittorrent.seyzahl.com"
spec:
  selector:
    app: gluetun
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: webui
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-torrent
  labels:
    cilium-lb-pool: apps-pool
spec:
  selector:
    app: gluetun
  type: LoadBalancer
  ports:
    - port: 6881
      targetPort: 6881
      protocol: TCP
      name: torrent-tcp
    - port: 6881
      targetPort: 6881
      protocol: UDP
      name: torrent-udp
---
