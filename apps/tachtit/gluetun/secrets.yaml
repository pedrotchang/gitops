apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-vpn-credentials
  namespace: gluetun
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: gluetun-wireguard-private-key
