---
# Static PV for Downloads
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gluetun-downloads-pv
spec:
  capacity:
    storage: 1000Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.7.14
    path: /mnt/tank/media/downloads
  mountOptions:
    - nfsvers=4.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads-pvc
  namespace: gluetun
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: gluetun-downloads-pv
  resources:
    requests:
      storage: 1000Gi
