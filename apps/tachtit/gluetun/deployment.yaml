---
# Bazarr UI setup (apps are now separate pods, use service DNS not localhost):
#   Settings → Sonarr: host=sonarr-internal.gluetun.svc.cluster.local port=8989
#   Settings → Radarr: host=radarr-internal.gluetun.svc.cluster.local port=7878
#   Settings → Providers: add Opensubtitles.com and/or Subdl (good anime coverage)
#   For anime: language profile = English only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr

  template:
    metadata:
      labels:
        app: bazarr
        policy-type: "app"

    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
            - name: media
              mountPath: /media

      restartPolicy: Always

      volumes:
        - name: bazarr-config
          persistentVolumeClaim:
            claimName: bazarr-config-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kapowarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kapowarr

  template:
    metadata:
      labels:
        app: kapowarr
        policy-type: "app"

    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: kapowarr
          image: mrcas/kapowarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: kapowarr-db
              mountPath: /app/db
            - name: kapowarr-temp-downloads
              mountPath: /app/temp_downloads
            - name: manga
              mountPath: /manga
            - name: comics
              mountPath: /comics
            - name: books
              mountPath: /books

      restartPolicy: Always

      volumes:
        - name: kapowarr-db
          persistentVolumeClaim:
            claimName: kapowarr-db-pvc
        - name: kapowarr-temp-downloads
          persistentVolumeClaim:
            claimName: kapowarr-temp-downloads-pvc
        - name: manga
          persistentVolumeClaim:
            claimName: manga-pvc
        - name: comics
          persistentVolumeClaim:
            claimName: comics-pvc
        - name: books
          persistentVolumeClaim:
            claimName: books-pvc
