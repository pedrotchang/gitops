apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-smoke
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: iscsi-smoke
  namespace: default
spec:
  containers:
    - name: test
      image: busybox:1.37
      command: ["sh", "-c", "echo iscsi-ok > /mnt/test && cat /mnt/test && sleep 3600"]
      volumeMounts:
        - name: vol
          mountPath: /mnt
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: iscsi-smoke
  restartPolicy: Never
