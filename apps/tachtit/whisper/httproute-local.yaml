# INTERNAL ONLY: exclude:true keeps the host out of public DNS (resolves via
# headscale split-DNS / LAN to the cilium-gateway). No cloudflared tunnel.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whisper-local
  namespace: whisper
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - whisper.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whisper
          port: 8000
