apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  labels:
    cilium-lb-pool: apps-pool
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jellyseerr.seyzahl.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "JellySeerr"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jellyseerr.png"
    gethomepage.dev/href: "http://jellyseerr.seyzahl.com"
spec:
  selector:
    app: jellyseerr
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5055
      protocol: TCP
