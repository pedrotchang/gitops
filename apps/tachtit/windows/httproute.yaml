apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: windows
  # Lives in the authentik namespace because every request goes to
  # authentik-server first: its embedded outpost authenticates, then proxies
  # to windows-gate (internal_host in blueprint-windows). Same namespace as the
  # backend, so no ReferenceGrant.
  namespace: authentik
  # INTERNAL ONLY: exclude:true keeps the host out of public DNS (resolves via
  # the *.seyzahl.com wildcard to the private gateway, Headscale/LAN only) and
  # there is no cloudflared tunnel. A banking PC is never on the WAN.
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Windows"
    gethomepage.dev/group: "Home"
    gethomepage.dev/icon: "windows-10.png"
    gethomepage.dev/href: "https://windows.seyzahl.com"
    gethomepage.dev/description: "On-demand Windows 11 (starts on open)"
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - windows.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80
