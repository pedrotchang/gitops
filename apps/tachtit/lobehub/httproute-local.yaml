# INTERNAL ONLY. All three hosts resolve via headscale split-DNS
# (extra_records) to the cilium-gateway; external-dns must NOT publish them
# (excludeDomains in the external-dns values — the annotation alone is ignored
# for gateway routes).
#   lobe.seyzahl.com          the app (long timeouts: voice-message
#                             transcription is one request that waits on whisper)
#   lobe-s3.seyzahl.com       RustFS — presigned browser uploads/previews
#   lobe-gateway.seyzahl.com  agent gateway WebSocket (no timeout, like headscale)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lobehub-local
  namespace: lobehub
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - lobe.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 900s
        backendRequest: 900s
      backendRefs:
        - name: lobehub
          port: 3210
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lobehub-s3-local
  namespace: lobehub
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - lobe-s3.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 900s
        backendRequest: 900s
      backendRefs:
        - name: lobehub-rustfs
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lobehub-gateway-local
  namespace: lobehub
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - lobe-gateway.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lobehub-gateway
          port: 8787
