apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: commafeed
  namespace: commafeed
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - commafeed.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: commafeed
          port: 8082
