apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authentik
  - blog
  - forgejo
  - forgejo-runner
  - homepage
  - immich
  - linkding
  - n8n
  - nextcloud
  # - roboflow-immich-analyzer
  - headscale
  # - home
  - windows

# Every app runs ONE replica (2026-11-17). Two replicas caused real bugs:
# - homepage: each pod hashes its own start time into /api/hash, so the
#   browser saw a "config change" on every load and reloaded forever;
# - standalone authentik outpost: login sessions live in pod memory;
# - forgejo: two pods on one volume lost merged refs.
# Rollouts still overlap: Deployments default to maxSurge 1 / maxUnavailable 0
# at 1 replica, so the new pod is Ready before the old one stops. Do NOT add
# minAvailable PodDisruptionBudgets: at 1 replica they block node drains.

patches:
  # Match each Deployment's own app label and ReplicaSet revision. Honor
  # taints so the reserved GPU node is not an empty spreading target.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (blog|homepage|authentik-outpost-homepage|cloudflared.*)
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeAffinityPolicy: Honor
            nodeTaintsPolicy: Honor
            # matchLabelKeys adds this pod's app and revision labels. Those
            # keys must not also occur in the base labelSelector.
            labelSelector: {}
            matchLabelKeys:
              - app
              - pod-template-hash
  # Readiness gates the 1-replica rollout overlap: without it the new pod is
  # "Ready" the instant it starts and the old one is killed before the new
  # tunnel has connected to Cloudflare / before homepage can serve.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cloudflared.*
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /ready
            port: 2000
          periodSeconds: 5
          failureThreshold: 2
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: homepage
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /api/healthcheck
            port: 3000
            # Homepage 400s any Host not in HOMEPAGE_ALLOWED_HOSTS, and the
            # kubelet sends the pod IP. localhost:3000 is always allowed.
            httpHeaders:
              - name: Host
                value: localhost:3000
          periodSeconds: 5
          failureThreshold: 2
