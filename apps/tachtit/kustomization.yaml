apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - authentik
  - blog
  - forgejo
  - forgejo-runner
  - homepage
  - immich
  - linkding
  # - media
  - n8n
  - nextcloud
  # - roboflow-immich-analyzer
  - headscale
  - hermes-agent
  - headroom
  # - home
  - whisper
  - llm
  - open-webui
  - lobehub
  - windows
  - replicated-app-budgets.yaml

# Stateless frontends can run two instances; single-writer services keep
# their existing replica counts and storage semantics.
replicas:
  - name: homepage
    count: 2
  - name: authentik-outpost-homepage
    count: 2

patches:
  # Match each Deployment's own app label and ReplicaSet revision. Honor
  # taints so the reserved GPU node is not an empty spreading target.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (blog|homepage|authentik-outpost-homepage|cloudflared.*)
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeAffinityPolicy: Honor
            nodeTaintsPolicy: Honor
            # matchLabelKeys adds this pod's app and revision labels. Those
            # keys must not also occur in the base labelSelector.
            labelSelector: {}
            matchLabelKeys:
              - app
              - pod-template-hash
