apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
    # homepage v1 Gateway API discovery (kubernetes.yaml: gateway: true);
    # enabled=false hides homepage's own tile, matching the retired Ingress
    gethomepage.dev/enabled: "false"
    gethomepage.dev/name: Homepage
    gethomepage.dev/description: Dynamically Detected Homepage
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: homepage.png
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - homepage.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - name: authentik-outpost-homepage
          port: 9000
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: homepage
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-outpost-homepage
          port: 9000
