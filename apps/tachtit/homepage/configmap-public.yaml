            icon: confluence.png
      - DevOps:
            href: http://jira.trueanomaly.io/projects/DEVOPS/summary
            icon: jira.png
      - DevOps SVC:
            href: http://jira.trueanomaly.io/projects/DEVOPSSVC/
            icon: jira.png
      - Glossary:
            href: http://confluence.trueanomaly.io/display/TA/terms/all
            icon: confluence.png
      - Apps:
            href: http://myapplications.azure.us
            icon: application-gateways.png
      - Claude-Gov:
            href: http://claude.fedstart.com/new
            icon: claude-ai.png
      - Github:
            href: http://github.trueanomaly.space/MCS
            icon: github.png
      - Azure:
            href: http://portal.azure.us
            icon: azure.png
      - Artifactory:
            href: http://artifactory.trueanomaly.space
            icon: artifactory.png
      - Chainguard:
            href: http://console.chainguard.dev/org/trueanomaly
            icon: chainguard.png
      - Keeper:
