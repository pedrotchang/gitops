apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  settings.yaml: |
    title: Seyza
    theme: dark
    color: slate
    target: _blank
    cardBlur: xl
    language: en
    hideVersion: true
    disableCollapse: true
    useEqualHeights: true
    headerStyle: boxed
    showStats: true
    hideErrors: true
    fullWidth: true
    fadeIn: true
    base: https://homepage.seyzahl.com
    favicon: /icons/amp.webp
    # Pastel landscape served from the homepage-assets configmap (see
    # kustomization.yaml). Filters keep light text readable over the pastels.
    background:
      image: /images/background.jpg
      brightness: 75
      saturate: 100
      opacity: 65
    links:
      - name: Google Fonts (Preconnect)
        href: https://fonts.gstatic.com
        rel: preconnect

      - name: Google Fonts
        href:: https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap
        rel: stylesheet

    layout:
      - Home:
          header: true
          style: row
          columns: 3
      # Headerless continuation of Home (renders as one seamless "Home"
      # section). Top Home row is 3-col (HA+Jellyfin+Immich); this
      # continuation has 4 tiles, so it's 4-col — each stretches to 1/4
      # width and fills the row edge-to-edge.
      - Home Apps:
          header: false
          style: row
          columns: 4
      - Professional:
          header: true
          style: row
          columns: 5
      - Admin:
          header: true
          style: row
          columns: 5
      - Media:
          header: true
          style: row
          columns: 6


  custom.css: |
    /* ================================
       custom.css - Modular & Final ⚡
       ================================ */

    /* ===== ROOT & VARIABLES ===== */
    :root {
      /* cores — deep-purple darks to sit clearly over the pastel landscape */
      --bg-main: #241e36d9;
      --bg-card: #221c33;
      --bg-card-light: #2a234066;
      --text-header: #fdb833;
      --text-emerald: #b4e3f9;
      --text-thin: #9dedf6;
      --text-accent: #6dc3ea;

      /* espaçamentos */
      --spacing-sm: calc(var(--spacing) * 0.5);
      --spacing-md: calc(var(--spacing) * 1);
      --spacing-lg: calc(var(--spacing) * 1.5);

      /* ícones */
      --icon-clock: url("/icons/relogio.svg");
    }

    /* ===== THEME OVERRIDES ===== */
    :root[data-theme="dark"][data-color="zinc"] {
      --bg-card: #221c33 !important;
    }

    /* Solid, clearly-bounded service cards over the pastel background */
    #page_container .service-card, .bookmark-card {
      background-color: var(--bg-card) !important;
      border: 1px solid #ffffff1f;
      border-radius: 8px;
    }

    /* ===== TEXT UTILITIES ===== */
    .text-emerald-500\/80 {
      color: color-mix(in oklab, var(--color-emerald-500) 80%, transparent);
      font-size: 0.67rem;
      text-transform: none;
    }

    .text-theme-500 {
      font-size: 0.9em;
      font-weight: 400;
      padding-top: 1px;
    }

    .text-theme-800 {
      display: inline-flex;
    }

    span.secondary-text.text-theme-800 {
      color: var(--text-accent);
      font-family: "JetBrains Mono", monospace;
    }

    .text-colored {
      font-family: "Roboto", sans-serif;
      letter-spacing: -0.5px;
    }

    .text-rose-300\/70 {
      color: color-mix(in oklab, rgb(255, 87, 108)70%, transparent);
    }

    .text-emerald-300\/70 {
      color: color-mix(in oklab, var(--color-emerald-300)70%, transparent);
    }

    .pl-0\.5 {
      padding-left: var(--spacing-sm);
      color: var(--text-emerald);
      font-weight: 500;
    }

    .font-thin {
      font-weight: 500;
      /* sobrescrevendo o thin de propósito */
      color: var(--text-thin);
    }

    /* ===== BACKGROUND / CARDS ===== */
    .dark\:bg-theme-900\/20:is(.dark *) {
      background-color: color-mix(in oklab, rgb(var(--color-900)/1) 20%, #00000014);
    }

    :is(.dark .dark\:bg-white\/5) {
      padding: 10px;
      border-radius: 7px;
      transition: transform 0.3s ease-in-out;
    }

    /* ===== SERVICE CARDS ===== */
    #revalidate {
      display: none;
    }

    .mr-auto-custom {
      margin-right: auto;
    }

    .service-icon--large img {
      margin-left: 2px;
      width: 35px;
      height: 35px;
    }

    .docker-status {
      display: inline-flex;
      background: #2525289c;
      border-radius: 0 0 10px 10px;
    }

    /* ===== SHADOWS ===== */
    .shadow-strong {
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    /* ===== TITLES ===== */
    .service-title-strong {
      font-weight: bold;
      font-size: 1.04rem;
    }

    /* ===== SPACING & LAYOUT ===== */
    .py-1\.5 {
      display: inline-flex;
      margin-right: 6px;
      padding-block: var(--spacing-lg);
      padding-inline: var(--spacing-md);
      border-radius: 5px;
      background: var(--bg-card-light);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .pr-1 {
      padding-right: var(--spacing-md);
      color: #c8c4c4;
      margin-left: 2px;
    }

    div.flex.flex-row.items-center.grow.justify-end {
      background-color: var(--bg-main);
      padding: 0 6px;
      border-radius: 8px;
      font-family: "JetBrains Mono", monospace;
      line-height: 1.4;
    }

    /* ===== ICON CLOCK (reliable) ===== */
    div.flex.flex-row.items-center.grow.justify-end::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 5px;
      background-image: var(--icon-clock);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
  custom.js: ""
  bookmarks.yaml: ""

  services.yaml: |

    - Home:
      - Jellyfin:
            href: https://jellyfin.seyzahl.com
            icon: jellyfin.png
            description: Watch
            widget:
              type: jellyfin
              url: http://jellyfin.media.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
              enableBlocks: true
              enableNowPlaying: true
      - Immich:
            href: https://immich.seyzahl.com
            icon: immich.png

    - Home Apps:
      - Frigate:
            href: https://frigate.seyzahl.com
            icon: frigate.png
            description: Baby camera (NVR)
      - Nextcloud:
            href: https://nextcloud.seyzahl.com
            icon: nextcloud.png
      - Linkding:
            href: https://linkding.seyzahl.com
            icon: linkding.png

    - Professional:
      - N8N:
            href: https://n8n.seyzahl.com/
            icon: n8n.png
      - AWS:
            href: https://d-9167748418.awsapps.com/start
            icon: aws.png
      - Azure:
            href: https://portal.azure.com/#home
            icon: azure.png
      - Kubernetes:
            href: https://kubernetes.io/docs/home/
            icon: kubernetes.png
            description: Kubernetes Docs
      - Forgejo:
            href: https://forgejo.seyzahl.com
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/forgejo.png

    - Admin:
      - Truenas:
            href: https://192.168.7.14
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/truenas-scale.png
      - Authentik:
            href: https://auth.seyzahl.com
            icon: authentik.png
      - Grafana:
            href: https://grafana-pedrotchang.workload.na-west-1.omni.siderolabs.io
            icon: grafana.png
            description: Monitoring
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              fields: ["targets_up", "targets_down", "alerts"]
      - Unifi:
            href: https://unifi.ui.com
            icon: unifi.png
      - Omni:
            href: https://pedrotchang.omni.siderolabs.io/
            icon: talos.png

    - Media:
      - Jellyseerr:
            href: https://jellyseerr.seyzahl.com
            icon: jellyseerr.png
            description: Request
            widget:
              type: jellyseerr
              url: http://jellyseerr.media.svc.cluster.local:5055
              key: "{{HOMEPAGE_VAR_JELLYSEERR_API_KEY}}"
      - Sonarr:
            href: https://sonarr.seyzahl.com
            icon: sonarr.png
            description: TV
            widget:
              type: sonarr
              url: http://sonarr.media.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
      - Radarr:
            href: https://radarr.seyzahl.com
            icon: radarr.png
            description: Movies
            widget:
              type: radarr
              url: http://radarr.media.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
      - Prowlarr:
            href: https://prowlarr.seyzahl.com
            icon: prowlarr.png
            description: Indexers
            widget:
              type: prowlarr
              url: http://prowlarr.media.svc.cluster.local:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
      - Bazarr:
            href: https://bazarr.seyzahl.com
            icon: bazarr.png
            description: Subtitles
            widget:
              type: bazarr
              url: http://bazarr.media.svc.cluster.local:6767
              key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"

  widgets.yaml: |

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: tachtit
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    # Data-cluster node stats via glances DaemonSet
    # (monitoring/controllers/data/glances) — homepage's kubernetes widget
    # only sees the cluster it runs in, so data nodes are polled directly.
    - glances:
        url: http://192.168.4.236:61208
        version: 4
        label: data · talos-676-4zu
        cpu: true
        mem: true

    - glances:
        url: http://192.168.6.42:61208
        version: 4
        label: data · talos-otc-2fk
        cpu: true
        mem: true

    - search:
        provider: google
        target: _blank

    # OpenWeatherMap (key staged in KV). Open-Meteo is unreachable from this
    # network (verified from pod AND workstation, 2026-07-02) — do not switch
    # back without testing api.open-meteo.com reachability first.
    - openweathermap:
        label: Los Angeles
        timezone: America/Los_Angeles
        latitude: 34.059761
        longitude: -118.276802
        units: imperial
        apiKey: "{{HOMEPAGE_VAR_OPENWEATHER_API_KEY}}"
        cache: 5
        format:
          maximumFractionDigits: 1
  docker.yaml: ""
