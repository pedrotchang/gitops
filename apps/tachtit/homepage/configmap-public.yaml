  widgets.yaml: |

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: tachtit
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - search:
        provider: google
        target: _blank

    # Open-Meteo: keyless. (Old openweathermap block had lat/long swapped.)
    - openmeteo:
        label: Los Angeles
        timezone: America/Los_Angeles
        latitude: 34.059761
        longitude: -118.276802
        units: metric
        cache: 5
        format:
          maximumFractionDigits: 1
  docker.yaml: ""
