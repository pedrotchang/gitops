apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-app
  namespace: nextcloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: cloudflared
            io.kubernetes.pod.namespace: nextcloud
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Hermes reaches Nextcloud CalDAV pod->service in-cluster (Family calendar),
    # bypassing the Cloudflare Tunnel whose WAF blocks CalDAV clients. Scoped to
    # the hermes-agent namespace, port 80 (the nextcloud container port).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes-agent
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
