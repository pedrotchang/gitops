# Keep one ready replica while the replicated frontends are rebalanced.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: immich-server-availability
  namespace: immich
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
