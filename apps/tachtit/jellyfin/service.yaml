apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  labels:
    cilium-lb-pool: apps-pool
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jellyfin.seyzahl.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jellyfin.png"
    gethomepage.dev/href: "http://jellyfin.seyzahl.com"
spec:
  selector:
    app: jellyfin
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8096
      protocol: TCP
      name: http
