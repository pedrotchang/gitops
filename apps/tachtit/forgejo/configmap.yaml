apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-configmap
data:
  # Server settings
  FORGEJO__server__DOMAIN: forgejo.seyzahl.com
  FORGEJO__server__ROOT_URL: https://forgejo.seyzahl.com/
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__server__APP_DATA_PATH: /data/app
  FORGEJO__server__SSH_DOMAIN: git.seyzahl.com
  FORGEJO__server__SSH_PORT: "2222"
  FORGEJO__server__SSH_LISTEN_PORT: "2222"
  FORGEJO__server__PER_WRITE_TIMEOUT: "-1"
  FORGEJO__server__PER_WRITE_PER_KB_TIMEOUT: "-1"

  # Database settings
  FORGEJO__database__DB_TYPE: postgres
  FORGEJO__database__HOST: forgejo-pg.seyzahl.com:5432
  FORGEJO__database__NAME: forgejo
  FORGEJO__database__SSL_MODE: disable

  # Security settings
  FORGEJO__security__INSTALL_LOCK: "true"

  # Actions settings
  FORGEJO__actions__ENABLED: "true"
  FORGEJO__actions__DEFAULT_ACTIONS_URL: https://data.forgejo.org

  # Packages / container registry
  FORGEJO__packages__ENABLED: "true"

  # Storage paths
  FORGEJO__repository__ROOT: /data/git
  FORGEJO__attachment__PATH: /data/app/attachments
  FORGEJO__lfs__PATH: /data/lfs
  FORGEJO__log__ROOT_PATH: /data/app/log
  FORGEJO__picture__AVATAR_UPLOAD_PATH: /data/app/avatars
  FORGEJO__picture__REPOSITORY_AVATAR_UPLOAD_PATH: /data/app/repo-avatars
  # Cache / session / queue / indexer (Redis-backed)
  FORGEJO__cache__ADAPTER: redis
  FORGEJO__cache__HOST: redis://forgejo-redis:6379/1
  FORGEJO__indexer__ISSUE_INDEXER_TYPE: db
  FORGEJO__queue__CONN_STR: redis://forgejo-redis:6379/2
  FORGEJO__queue__TYPE: redis
  FORGEJO__session__PROVIDER: redis
  FORGEJO__session__PROVIDER_CONFIG: redis://forgejo-redis:6379/0

  # OpenID Connect / OAuth2
  # NOTE: Authentik OAuth2 provider must be added via Forgejo Admin UI (Site Administration → Authentication Sources)
  # These settings enable OpenID Connect support in Forgejo
  FORGEJO__openid__ENABLE_OPENID_SIGNIN: "true"
  FORGEJO__openid__ENABLE_OPENID_SIGNUP: "true"
  FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "false"
