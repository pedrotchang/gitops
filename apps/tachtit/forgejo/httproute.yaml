apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    # published as an UNPROXIED A record to the LAN gateway IP so Talos nodes and
    # pods can resolve the registry hostname; the IP is private — not internet-reachable
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - forgejo.seyzahl.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo
          port: 3000
