# Imported once, on pulsewatch's first start (empty database). After that the admin UI
# (status.seyzahl.com/admin) is the source of truth; export from Settings to refresh this file.
# Backups, Flux and nodes are not listed: the pulsewatch-reporter CronJobs register them.
title = "seyzahl"

# ---- Services (public URLs) ----
[[check]]
name = "Blog"
kind = "http"
target = "https://pedrotchang.dev/"

[[check]]
name = "Forgejo"
kind = "http"
target = "https://forgejo.seyzahl.com/api/healthz"

[[check]]
name = "Authentik (SSO)"
kind = "http"
target = "https://auth.seyzahl.com/-/health/live/"

[[check]]
name = "Nextcloud"
kind = "http"
target = "https://nextcloud.seyzahl.com/status.php"
expect_text = "\"maintenance\":false"

[[check]]
name = "Linkding"
kind = "http"
target = "https://linkding.seyzahl.com/health"

[[check]]
name = "Homepage"
kind = "http"
target = "https://homepage.seyzahl.com/"

