apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db-tachtit-cnpg-v0
spec:
  description: Postgres cluster for Nextcloud
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 2

  inheritedMetadata:
    labels:
      app: nextcloud-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nextcloud-aws-store
        # Archive under a fresh serverName so the 07-30 backup we are restoring
        # from stays pristine and re-runnable if this restore needs a retry.
        serverName: nextcloud-db-tachtit-cnpg-v0-r1

  storage:
    size: 5Gi

  # 2026-09-07 rebuild: restore from the 2026-07-30 backup (cluster was shut
  # down 07-30, so that backup is the last live state — no data loss).
  bootstrap:
    recovery:
      source: nextcloud-db-prev

  externalClusters:
    - name: nextcloud-db-prev
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: nextcloud-aws-store
          serverName: nextcloud-db-tachtit-cnpg-v0

  resources:
    requests:
      memory: 512Mi

  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "nextcloud-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: nextcloud-pg.seyzahl.com
            spec:
              type: LoadBalancer
