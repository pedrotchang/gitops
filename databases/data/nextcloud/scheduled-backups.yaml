apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  immediate: true
  schedule: "0 0 3 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: nextcloud-db-tachtit-cnpg-v0
