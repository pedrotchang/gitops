apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db-tachtit-cnpg-v0
spec:
  description: Postgres cluster for Immich with VectorChord extension
  # Using tensorchord image which includes VectorChord for ML embeddings
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.0
  # Single-node data cluster: replicas share one failure domain, so they add
  # no HA. Read services are disabled (see managed.services below), so they
  # serve no traffic either. Raise this if data ever gets a second node.
  instances: 1

  inheritedMetadata:
    labels:
      app: immich-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  storage:
    size: 10Gi

  postgresql:
    shared_preload_libraries:
      - vchord.so

  # Recovery source = the LIVE backups (-r1). The pre-rebuild -v0 backups were
  # deleted 2026-11-13. bootstrap only runs when the Cluster is first created;
  # to rebuild from backup, also move backup.serverName below to a fresh -r2
  # (barman will not archive into a path that already holds WAL).
  bootstrap:
    recovery:
      source: immich-db-prev

  externalClusters:
    - name: immich-db-prev
      barmanObjectStore:
        destinationPath: https://seyzahldata.blob.core.windows.net/immich
        serverName: immich-db-tachtit-cnpg-v0-r1
        azureCredentials:
          connectionString:
            name: azure-creds
            key: connection-string-2
        wal:
          compression: gzip

  backup:
    barmanObjectStore:
      destinationPath: https://seyzahldata.blob.core.windows.net/immich
      # Post-2026-09-07-rebuild archive; also the recovery source above.
      serverName: immich-db-tachtit-cnpg-v0-r1
      azureCredentials:
        connectionString:
          name: azure-creds
          key: connection-string-2
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "10d"

  resources:
    requests:
      memory: 1Gi

  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "immich-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: immich-pg.seyzahl.com
            spec:
              type: LoadBalancer
