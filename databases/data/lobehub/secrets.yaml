# App owner login from Key Vault. The same lobehub-db-* values feed DATABASE_URL in
# the tachtit lobehub ExternalSecret, so both clusters agree without git ever
# holding them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lobehub-db-creds
  namespace: lobehub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: lobehub-db-username
    - secretKey: password
      remoteRef:
        key: lobehub-db-password
