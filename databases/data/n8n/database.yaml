apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db-tachtit-cnpg-v0
spec:
  description: Postgres cluster for the n8n application
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  # Single-node data cluster: replicas share one failure domain, so they add
  # no HA. Read services are disabled (see managed.services below), so they
  # serve no traffic either. Raise this if data ever gets a second node.
  instances: 1

  inheritedMetadata:
    labels:
      app: n8n-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-db-creds


  # No backups, on purpose (Pedro, 2026-11-13): n8n is rarely used and its data
  # is not worth keeping. The Azure container `n8n` was deleted. CNPG skips WAL
  # archiving when no backup is configured, so WAL does not pile up on disk.
  # Re-enabling = restore the barmanObjectStore block from git history (it uses
  # azure-creds key connection-string-2), recreate the container, and add back
  # scheduled-backups.yaml + the azure-creds ExternalSecret.

  resources:
    requests:
      memory: 100Mi
  storage:
    size: 1Gi

  managed:
    services:
      ## disable the default services
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "n8n-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: n8n-pg.seyzahl.com
            spec:
              type: LoadBalancer
