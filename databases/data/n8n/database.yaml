apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db-tachtit-cnpg-v0
spec:
  description: Postgres cluster for the n8n application
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  # Single-node data cluster: replicas share one failure domain, so they add
  # no HA. Read services are disabled (see managed.services below), so they
  # serve no traffic either. Raise this if data ever gets a second node.
  instances: 1

  inheritedMetadata:
    labels:
      app: n8n-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-db-creds


  # externalClusters:
  #   - name: clusterBackup
  #     barmanObjectStore:
  #       destinationPath: https://seyzahldata.blob.core.windows.net/n8n
  #       serverName: n8n-db-tachtit-cnpg-v1
  #       azureCredentials:
  #         connectionString:
  #           name: azure-creds
  #           key: n8n-connection-string

  # 2026-09-07: backups were commented out here, so the n8n Azure container was
  # empty and this database was NOT recoverable after the rebuild — it is the
  # only one that came back blank. Enabled so that cannot happen again.
  backup:
    barmanObjectStore:
      destinationPath: https://seyzahldata.blob.core.windows.net/n8n
      serverName: n8n-db-tachtit-cnpg-v0
      azureCredentials:
        connectionString:
          name: azure-creds
          key: n8n-connection-string
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "14d"

  resources:
    requests:
      memory: 100Mi
  storage:
    size: 1Gi

  managed:
    services:
      ## disable the default services
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "n8n-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: n8n-pg.seyzahl.com
            spec:
              type: LoadBalancer
