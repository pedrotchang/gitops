apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db-data-cnpg-v0
spec:
  description: Postgres cluster for the forgejo application
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  # Single-node data cluster: replicas share one failure domain, so they add
  # no HA. Read services are disabled (see managed.services below), so they
  # serve no traffic either. Raise this if data ever gets a second node.
  instances: 1

  inheritedMetadata:
    labels:
      app: forgejo-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  storage:
    size: 2Gi

  # 2026-09-07 rebuild: restore from the 2026-07-30 backup (cluster was shut
  # down 07-30, so that backup is the last live state — no data loss).
  bootstrap:
    recovery:
      source: forgejo-db-prev

  externalClusters:
    - name: forgejo-db-prev
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: forgejo-aws-store
          serverName: forgejo-db-data-cnpg-v0

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-aws-store
        # Archive under a fresh serverName so the 07-30 backup we are restoring
        # from stays pristine and re-runnable if this restore needs a retry.
        serverName: forgejo-db-data-cnpg-v0-r1

  resources:
    requests:
      memory: 320Mi

  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "forgejo-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: forgejo-pg.seyzahl.com
            spec:
              type: LoadBalancer
