apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db-tachtit-cnpg-v1
spec:
  description: Restored authentik DB — PITR recovery from v0 S3 object store to just before the 2026 migration damage (2026-06-16T17:20:00Z)
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3

  inheritedMetadata:
    labels:
      app: authentik-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  # 2026-09-07 rebuild: recover to the LATEST available backup, not the old
  # 2026-06-16 PITR point. The targetTime below was for the one-off v0->v1
  # migration in June; leaving it in would have rolled authentik back ~6 weeks.
  # Source is now v1 (its own last backups: base 20260730T030004 + WAL to 07-30
  # 12:02), which is the last live state before the 07-30 shutdown.
  bootstrap:
    recovery:
      source: authentik-db-prev

  externalClusters:
    - name: authentik-db-prev
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: authentik-aws-store
          serverName: authentik-db-tachtit-cnpg-v1

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-aws-store
        # Archive under a fresh serverName so the 07-30 backup we are restoring
        # from stays pristine and re-runnable if this restore needs a retry.
        serverName: authentik-db-tachtit-cnpg-v1-r1

  resources:
    requests:
      memory: 256Mi
  storage:
    size: 2Gi

  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "authentik-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: authentik-pg.seyzahl.com
                lbipam.cilium.io/ips: "192.168.4.164"
            spec:
              type: LoadBalancer
