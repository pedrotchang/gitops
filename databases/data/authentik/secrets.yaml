apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-creds
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: authentik-db-username
    - secretKey: password
      remoteRef:
        key: authentik-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-backup-creds
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: ClusterSecretStore
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: aws-backup-access-key-id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: aws-backup-secret-access-key
