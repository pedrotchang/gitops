apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-db
  namespace: authentik
spec:
  immediate: true
  schedule: "0 0 3 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: authentik-db-tachtit-cnpg-v1
