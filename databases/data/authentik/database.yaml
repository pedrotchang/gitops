apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db-tachtit-cnpg-v0
spec:
  description: Postgres cluster for the authentik application
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 3

  inheritedMetadata:
    labels:
      app: authentik-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-aws-store

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-creds

  resources:
    requests:
      memory: 256Mi
  storage:
    size: 2Gi

  managed:
    services:
      ## LB moved to v1 during the restore cutover
      disabledDefaultServices: ["ro", "r"]
