apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: brick-building-db
  namespace: brick-building
spec:
  immediate: true
  schedule: "0 0 3 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: brick-building-db-tachtit-cnpg-v0
