apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: headscale-db-tachtit-cnpg-v0
spec:
  description: Postgres cluster for the headscale application
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  # Single-node data cluster: replicas share one failure domain, so they add
  # no HA. Read services are disabled (see managed.services below), so they
  # serve no traffic either. Raise this if data ever gets a second node.
  instances: 1

  inheritedMetadata:
    labels:
      app: headscale-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  storage:
    size: 1Gi

  # Recovery source = the LIVE backups (-r1). The pre-rebuild -v0 backups were
  # deleted 2026-11-13. bootstrap only runs when the Cluster is first created;
  # to rebuild from backup, also move backup.serverName below to a fresh -r2
  # (barman will not archive into a path that already holds WAL).
  bootstrap:
    recovery:
      source: headscale-db-prev

  externalClusters:
    - name: headscale-db-prev
      barmanObjectStore:
        destinationPath: https://seyzahldata.blob.core.windows.net/headscale
        serverName: headscale-db-tachtit-cnpg-v0-r1
        azureCredentials:
          connectionString:
            name: azure-creds
            key: headscale-connection-string
        wal:
          compression: gzip

  backup:
    barmanObjectStore:
      destinationPath: https://seyzahldata.blob.core.windows.net/headscale
      # Post-2026-09-07-rebuild archive; also the recovery source above.
      serverName: headscale-db-tachtit-cnpg-v0-r1
      azureCredentials:
        connectionString:
          name: azure-creds
          key: headscale-connection-string
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "14d"

  resources:
    requests:
      memory: 320Mi

  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "headscale-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: headscale-pg.seyzahl.com
            spec:
              type: LoadBalancer
