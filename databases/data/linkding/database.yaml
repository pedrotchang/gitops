apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkding-db-tachtit-cnpg-v0
spec:
  description: Postgres cluster for the linkding application
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  instances: 2

  inheritedMetadata:
    labels:
      app: linkding-database
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  storage:
    size: 1Gi

  # 2026-09-07 rebuild: restore from the 2026-07-30 backup (cluster was shut
  # down 07-30, so that backup is the last live state — no data loss).
  bootstrap:
    recovery:
      source: linkding-db-prev

  externalClusters:
    - name: linkding-db-prev
      barmanObjectStore:
        destinationPath: https://seyzahldata.blob.core.windows.net/linkding
        serverName: linkding-db-tachtit-cnpg-v0
        azureCredentials:
          connectionString:
            name: azure-creds
            key: linkding-connection-string
        wal:
          compression: gzip

  backup:
    barmanObjectStore:
      destinationPath: https://seyzahldata.blob.core.windows.net/linkding
      # Archive under a fresh serverName so the 07-30 backup we are restoring
      # from stays pristine and re-runnable if this restore needs a retry.
      serverName: linkding-db-tachtit-cnpg-v0-r1
      azureCredentials:
        connectionString:
          name: azure-creds
          key: linkding-connection-string
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "14d"

  resources:
    requests:
      memory: 320Mi

  managed:
    services:
      ## disable the default services
      disabledDefaultServices: ["ro", "r"]
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "linkding-db-lb"
              labels:
                cilium-lb-pool: postgres-pool
              annotations:
                external-dns.alpha.kubernetes.io/hostname: linkding-pg.seyzahl.com
            spec:
              type: LoadBalancer
